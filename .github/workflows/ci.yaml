name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    # This job used to also carry the probe sweep and the autopilot example, and
    # ran 57.6 min against a 60-minute cap on 2026-08-13 - 2.4 minutes of
    # headroom. The sweep then doubled (21 -> 42 min) over the v0.11.0 cycle as
    # examples were added and got heavier, which put the serial worst case near
    # 76 min. The three are independent, so they are three jobs now and this one
    # keeps only the compile-and-test gate.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # BUILD tier only. Bevy links the ALSA + udev headers, and a transitive
      # dep's build script pkg-configs wayland/xkb even when nothing opens a
      # window. The RUNTIME tier (Vulkan loader, mesa's lavapipe, Xvfb) left
      # with the probe sweep - the tests in this job launch nothing.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # rust-toolchain.toml pins a DATED nightly with rustfmt + clippy. Resolve
      # it here so a toolchain problem surfaces on its own step instead of being
      # folded into the first (slow) cargo invocation. `rustup show` installs
      # whatever the file names - it must not name a channel itself, or it
      # installs a toolchain the pin then ignores.
      - name: Install Rust nightly toolchain
        run: rustup show active-toolchain

      # cache-on-failure matters here: while the example runs were flaky every
      # run failed, the cache never saved, and every run paid a ~25 min cold
      # build - which is what blew the job timeout.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The suite documented in AGENTS.md ("Build, run, test"), run as CI is now
      # the source of truth for it.
      - name: Formatting
        run: cargo fmt --check

      # Every generator that owns COMMITTED build output and carries a
      # `--check`: each one rebuilds its pieces in memory and compares them
      # byte for byte with the tree, so a stale commit or a non-deterministic
      # edit fails here instead of churning art in an unrelated diff. The list
      # was greebles + thruster shells only, which left the section parts, the
      # scenario and news thumbnails and both lore exporters ungated - the same
      # contract, unenforced. All seven are stdlib-only Python and cost 14s
      # together. `gen-web-screenshots.py` is NOT here and cannot be: it has no
      # `--check`, and its inputs are captured game renders, not a pure
      # function of the sources.
      - name: Generated art is deterministic
        run: |
          python3 scripts/gen-greebles.py --check
          python3 scripts/gen-thruster-shells.py --check
          python3 scripts/gen-section-parts.py --check
          python3 scripts/gen-scenario-thumbnails.py --check
          python3 scripts/gen-news-thumbnails.py --check
          python3 scripts/gen-lore-designs.py --check
          python3 scripts/gen-lore-portraits.py --check

      # The probe job shards by NAMING its examples, so an example that joins
      # the catalog and no shard would never run and nothing would say so -
      # every shard would still report green over the names it knows. The
      # script expands the shard lists out of the matrix in this same file and
      # fails unless they partition the `[[example]]` catalog exactly. Cheap,
      # runs before the expensive steps, and runnable locally before a push.
      # `nova_probe_cli`'s `catalog_drift.rs` owns the other half of the chain
      # (examples/ on disk <-> Cargo.toml), so the two together mean every
      # example file runs in exactly one shard.
      - name: Probe shards partition the example catalog
        run: python3 scripts/check-probe-shards.py

      # One clippy pass, workspace-wide, with the debug feature on. `debug`
      # fans out to every crate's debug feature (nova_debug has none - it IS
      # the debug tooling - and cargo is fine with that), so this lints the
      # debug-gated code too. The HOST default-features gap is covered by the
      # cheap `check` job below rather than by a second clippy pass here, which
      # would cost a near-full second build on 2 cores. The wasm gap gets its
      # own clippy pass, because the target is where its extra bans are correct.
      #
      # This pass must NOT see ci/wasm-clippy/clippy.toml: on a host target
      # `bevy::platform::time::Instant::now` resolves to the std path that file
      # bans, so its list would flag correct code here. There is no repository
      # root clippy.toml, and only the wasm job sets CLIPPY_CONF_DIR.
      #
      # `-D warnings` is what makes this a gate rather than a report, and it is
      # what catches the unused imports and dead code a refactor leaves behind.
      # It also promotes `unfulfilled_lint_expectations`, so a stale
      # `#[expect(..)]` fails here - see CONVENTIONS.md rule 8.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features debug -- -D warnings

      # Every crate's tests, with the same feature set the smoke examples use.
      # That feature match is the whole point: `debug` flips bevy/track_location,
      # so testing with default features and then running examples with
      # `--features debug` rebuilds Bevy and everything downstream a second
      # time - the other half of what blew the job timeout. The probe shards no
      # longer inherit this step's example binaries (they are their own jobs
      # now) and build their own behind a shared cache. No DISPLAY is set here,
      # and the tests in this step launch nothing; this is the pure
      # unit/integration gate.
      - name: Tests
        run: cargo test --workspace --features debug

  # The non-Rust half of the tree, which had NO job until now: `npm ci` +
  # `npm run build:*` in the two deploy workflows was the only npm anywhere,
  # so `web/package.json`'s `ci` script - format, lint, fourteen test suites
  # and the released-only build - ran nowhere, and neither did the 62 Python
  # tests under `scripts/nova_illustration/` and the episode `art/` modules.
  #
  # Its own job because it shares nothing with the Rust gates: no toolchain, no
  # apt tier, no cargo cache. The whole thing measured 1m19s locally against
  # `check`'s 45-minute budget, so the web signal arrives while the compile
  # gate is still linking.
  web:
    name: web / npm suite + python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The comic determinism step below diffs two generated trees, and every
      # art module is imported from inside the checkout. Stray `__pycache__`
      # would join the comparison and the `find` sweep alike.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      # Node 22 matches both deploy workflows - this job must fail on what they
      # would fail on. The npm cache is keyed on the lockfile, the same
      # contract the Rust jobs' cache has with Cargo.lock.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # `npm run ci` IS the suite, run as the script rather than as its parts
      # so this job and a local run cannot drift: format:check, eslint, the
      # fourteen test suites (site, story-reader, theme, widgets, comic-page,
      # comic-renderer, comics, comic-script, story-build,
      # scripts/test_deploy_pages.py, ron, lore, assets) and the released-only
      # webpack build. `test:deploy` inside it is the publicPath gate - it
      # builds the story at `/` and at `/nova-protocol/` and asserts every
      # emitted resource resolves under its prefix.
      - name: Web suite
        working-directory: web
        run: npm run ci

      # The shared drawing library: ships, faces, expressions, scenes. The
      # invocation is the one its README documents.
      - name: Illustration library tests
        run: python3 -m unittest discover -s scripts/nova_illustration -p 'test_*.py'

      # The episode art modules. This FINDS its suites rather than listing
      # them, so a new season/episode's tests join by existing - and it fails
      # loudly when it finds none, which is the same insurance the probe-matrix
      # step above carries: a directory rename must stop the build, not stop
      # the testing.
      - name: Comic art tests
        run: |
          mapfile -t suites < <(find web/src/comics -name 'test_*.py' -printf '%h\n' | sort -u)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no comic art tests found under web/src/comics"
            exit 1
          fi
          for art in "${suites[@]}"; do
            echo "== $art"
            python3 -m unittest discover -s "$art" -t "$art" -p 'test_*.py'
          done

      # The comic generator's determinism gate. It cannot be a byte-compare
      # against the tree the way `check`'s art step is: the ~12 MB of SVG it
      # emits lands in `web/.cache/` and is never committed. So the property is
      # that two PROCESSES agree - `PYTHONHASHSEED` moves string hashing, which
      # moves set iteration, which is the one order in this pipeline that can
      # silently reshuffle a painter pass or a definition block. It lives here
      # rather than in `check` because reaching the generator means running the
      # Node build that selects the scenes.
      - name: Comic generator is deterministic
        working-directory: web
        run: |
          rm -rf .cache/story
          PYTHONHASHSEED=0 npm run build:story
          mv .cache/story/release/generated "$RUNNER_TEMP/comic-seed-0"
          rm -rf .cache/story
          PYTHONHASHSEED=524287 npm run build:story
          diff -r "$RUNNER_TEMP/comic-seed-0" .cache/story/release/generated

  # SHARDED BY SUBJECT, and the shard axis is across RUNNERS on purpose. Under
  # lavapipe the render is CPU work, so running several examples at once on one
  # runner would make them fight for the same cores - slower overall, and a
  # starved run can trip the fixed-step clamp spiral and fail for a reason that
  # has nothing to do with the code. Each shard gets its own machine instead.
  #
  # The shards used to BE the three examples/ directories, which needed no list
  # but could not be balanced: measured on run 34521413852 (2026-09-10, warm
  # cache, all green, 99 examples) screenshots ran 54.6 min against playable's
  # 21.2, so one directory was the whole critical path and every new screenshot
  # made it worse. `probe run` takes a comma list of example names as readily as
  # a directory (`native/spec.rs::resolve_spec`), so the shards are SUBJECTS
  # now, sized off that run's per-example times: nine lists of 15-21 min each,
  # against a 21-min `check` job that is the floor worth aiming at. A red shard
  # also says "gunnery is red" rather than "screenshots is red".
  #
  # The cost of a named list is that a new example must be given a home. That is
  # the `check` job's "Probe shards partition the example catalog" step, which
  # fails the build until it has one - the list can go stale loudly, never
  # silently. Rebalance by moving names between shards when a re-measure says a
  # shard has drifted; add a shard when the set no longer fits in ~20 min.
  probe:
    name: probe / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Sized for a COLD cache, which is the case that bites: the first sharded
    # run had no `probe-debug` cache to restore, so every shard paid a full
    # ~20-minute build before running anything, and screenshots (the longest at
    # 17.7 min of runs) hit 45.7 and was killed by a 45-minute cap. A warm shard
    # is closer to 20 minutes end to end; this has to cover the cold one, which
    # recurs whenever Cargo.lock moves or the cache is evicted.
    timeout-minutes: 75
    strategy:
      # One red shard must not cancel the others - the whole point is to learn
      # about every subject from one run.
      fail-fast: false
      # Each entry is `probe run`'s spec for that shard, space separated (the
      # step turns the whitespace into the commas the CLI splits on). The
      # trailing number on each comment is that shard's measured run time on
      # 2026-09-10's green sweep, in seconds, before the ~6 min every shard
      # spends on checkout, apt, cache restore and linking its binaries.
      matrix:
        include:
          # Both editor outliers sit here (`screenshot_editor` 185 s and
          # `system_ship_editor` 245 s), so this is the shard to watch. 705 s.
          - shard: editor
            examples: >-
              screenshot_editor screenshot_planet_editor system_ship_editor
              system_field_controls bug_sandbox_soak parts_viewer widget_zoo
          # The front end a player boots into: main menu, scenario picker,
          # NOVA OS, settings, and the refusals that keep it standing. 694 s.
          - shard: menu
            examples: >-
              screenshot_menu screenshot_scenario_picker screenshot_comms
              screenshot_nova_os_apps screenshot_nova_os_terminal
              loop_command_shell system_menu_boot system_nova_os
              system_command_shell system_scenario_picker system_session_loop
              system_settings_persist system_pause_settings bug_failed_assets
              bug_menu_fallback bug_outcome_pause bug_refused_scenario
          # The in-flight readout and the input paths that drive it, including
          # every headless spike - they are cheap and they belong here. 550 s.
          - shard: hud
            examples: >-
              screenshot_hud_shell screenshot_contextual_hud system_hud_shell
              system_hud_scales system_hud_indicators system_mission_hud
              system_ui_scale system_input_modes system_headless_crt
              system_headless_drag system_headless_novaos
              system_headless_pointer system_headless_rebind
              system_headless_replay
          # Aiming and holding a target: turrets, the railgun, the lock chain
          # and the AI that flies against it. 828 s.
          - shard: gunnery
            examples: >-
              screenshot_combat_hud screenshot_combat_lock
              screenshot_combat_wide screenshot_radar_lock screenshot_railgun
              railgun_wake_bench system_railgun_hulls system_railgun_lance
              system_turret_gunnery system_borrowed_battery
              system_lock_line_of_sight system_wreck_lock system_ai_combat
              system_ai_evade system_ai_patrol bug_neutralized_quiet
          # What leaves the tube and what it does on arrival: rounds, torpedoes,
          # blast, and the VFX range that draws them. 799 s.
          - shard: ordnance
            examples: >-
              loop_round_types loop_torpedo_blast loop_turret_stow
              loop_vfx_range screenshot_torpedo_run system_torpedo_launch
              system_torpedo_capital system_blast_penetration stress_torpedoes
              stress_point_defense stress_bullets
          # The ship as metal: section galleries, hull generation, and damage
          # read off a hull that is still standing. 711 s.
          - shard: hull
            examples: >-
              screenshot_section_frame screenshot_section_gallery
              screenshot_section_drives screenshot_section_weapons
              screenshot_section_trials screenshot_hull_juice
              screenshot_damage_levels loop_sections_compare loop_spine_cut
              loop_hull_generate loop_damage_sequence loop_death_compare
              system_section_severing system_hull_damage system_hull_scaling
          # The same metal coming apart, which is where the heavy stress ranges
          # live. 753 s, and the least certain: `system_collision_damage`'s
          # 289 s is a FAILED run's clock, not a healthy one.
          - shard: destruction
            examples: >-
              stress_hull_collapse stress_one_structure stress_many_structures
              system_collision_damage system_destruction_finale
              carve_asteroids bug_carve_apply shape_bench
          # Moving through the world: burns, orbits, helm orders, gravity, and
          # the scenario grammar that scores the trip. 848 s.
          - shard: flight
            examples: >-
              screenshot_flip_burn screenshot_goto_burn screenshot_orbit
              loop_cockpit loop_goto_arrival loop_goto_standoff
              loop_helm_orders loop_player_flight system_attitude_hold
              system_flight_legs system_gravity_wells system_helm_orders
              system_turn_limit system_thrust_and_plume system_player_path
              system_cinematic system_scenario_grammar system_outcomes
              system_ship_audio first_shift_map
          # Everything a generator makes before a scenario picks it up:
          # asteroids, planets, greebles, WFC ships, thrusters. 867 s.
          - shard: worldgen
            examples: >-
              asteroid_kinds compare_asteroids planet_types compare_planets
              greeble_catalog block_bench wfc_arena wfc_ships first_shift_ships
              loop_belt_compare loop_derived_skin screenshot_hero_ship
              screenshot_thruster_gallery
    steps:
      - uses: actions/checkout@v4

      # Both dep tiers: this job is the one that actually LAUNCHES examples, so
      # it needs the Vulkan loader, mesa's lavapipe rasterizer and Xvfb on top
      # of the build headers. See the `check` job for what each is for.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers xvfb

      - name: Install Rust nightly toolchain
        run: rustup show active-toolchain

      # One cache for every shard (`shared-key`), not one each: they build the
      # same `--features debug` graph, and nine separate Rust caches would
      # crowd the repository's cache budget and evict each other. A shard still
      # links its own example binaries, but that is ~3s apiece once the
      # dependency graph is warm - far cheaper than the eviction.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: probe-debug
          cache-on-failure: true

      # The windowed run gate: correctness-only probe spawns every cataloged
      # example in this category under NOVA_AUTOPILOT/Xvfb (lavapipe renders)
      # and grades process exit, run completion, reached-Playing, invariants,
      # and log cleanliness. It skips the separate FPS and traced passes; full
      # local/release probe runs own performance evidence.
      # `aggregate_exit` returns FAILURE on anything past OK/WARN/UNPROBEABLE
      # (UNPROBEABLE is the sanctioned no-probe-plugin opt-out, still gated on
      # its smoke checks), so this is a blocking gate. It REPLACED
      # tests/examples_smoke.rs (task 20260805-185103 step 6): probe asserted a
      # superset of what the smoke suite covered, and one verdict implementation
      # beats two that could disagree.
      #
      # BLOCKING since 20260710-143138: the taffy panic (resolve.rs
      # unreachable, GitHub runners only) was observed deterministically on the
      # pre-rework 03_scenario and did not survive the 20260712-211352 examples
      # rework - the full reworked suite ran green on ubuntu-latest (run
      # 29283727248, 2026-07-13). If it ever resurfaces, this step fails loudly
      # with RUST_BACKTRACE=full and the investigation record lives in
      # tasks/20260710-143138/NOTES.md ("The taffy panic").
      - name: Probe correctness sweep
        env:
          RUST_BACKTRACE: full
          SHARD_EXAMPLES: ${{ matrix.examples }}
        # probe is the game binary's `probe` subcommand, which only exists
        # under --features debug. That flag is also what keeps this step on ONE
        # Bevy variant: probe builds each example itself with --features debug,
        # and the host binary's own graph (via nova_probe_cli's passthrough
        # down to bevy/track_location) matches it - default features would flip
        # track_location back off and pay for a second variant inside this
        # step. --out keeps run directories off the checkout.
        #
        # --timeout is the ONE bound this step sets. Probe sizes the harness's
        # own completion deadline from it (timeout minus 30 s), so the child
        # gives up first and names what it was still waiting on instead of
        # dying as a bare process kill. Pinning NOVA_AUTOPILOT_DEADLINE here
        # too would win over that sizing and make this dial do nothing, which
        # is how a 280 s pin under a 300 s timeout used to read.
        #
        # A HANG detector, not a performance gate - the job carries its own cap
        # - so it is sized to let the longest healthy walk finish rather than to
        # police it. Software rendering is what makes that walk long: two
        # carriers meeting nose to nose cost `system_collision_damage` 24 real
        # seconds per simulated one on a two-core runner, and it was still
        # pressing them together when the old 280 s deadline expired at
        # simulated 15.25 s (run 34959859343). 510 leaves it about a quarter
        # over the ~400 s it wants.
        #
        # The shard's list arrives whitespace separated and folded onto one
        # line by YAML; `probe run` wants one comma-separated token, and it
        # drops empty ones, so squeezing the whitespace into commas is the
        # whole conversion. It goes through the environment rather than into
        # the command line so the list is never re-split by the shell.
        run: |
          spec=$(printf '%s' "$SHARD_EXAMPLES" | tr -s '[:space:]' ',')
          xvfb-run --auto-servernum \
            cargo run --features debug -- \
            probe run "$spec" --correctness-only --timeout 510 \
            --out "$RUNNER_TEMP/probe-runs"

      # The shard's verdict table, ON the run page. Artifacts are auth-gated
      # zips that GitHub never renders, so index.html is unreadable without a
      # download; this puts the same rows (verdict, measured n/total, the
      # failing check names) in the job summary, which GitHub renders inline.
      # Sanitized markdown - the report's own CSS cannot come along, so this is
      # a second RENDERING of index.json, never a second verdict.
      #
      # `if: always()` and the script's own exit-0-on-missing-index are both
      # load-bearing: the summary is worth most on the runs that failed, and it
      # must never turn a green sweep red by failing to describe it.
      - name: Probe summary
        if: always()
        run: >-
          python3 scripts/probe-summary.py
          --runs "$RUNNER_TEMP/probe-runs"
          --title "probe / ${{ matrix.shard }}"
          --artifact "probe-runs-${{ matrix.shard }}"
          >> "$GITHUB_STEP_SUMMARY"

      # The reports and logs for whatever the sweep graded, green or not: a
      # failing check is diagnosed from its run.log, which the step output only
      # tails. Named per shard - artifact names must be unique within a run.
      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-runs-${{ matrix.shard }}
          path: ${{ runner.temp }}/probe-runs
          if-no-files-found: ignore
          retention-days: 7

  # nova_autopilot's own end-to-end proof: its `driven_app` example is a
  # standalone DefaultPlugins app driven Boot -> Flying -> Done, and this
  # asserts the exit status plus the harness log lines. Written with no
  # `--features` on purpose: `debug` is a nova-protocol feature that flips
  # bevy/track_location, and the nested `cargo run -p nova_autopilot` resolves
  # without it - so this costs ONE extra cached Bevy variant, and the test
  # binary and its nested run share that one graph. Never running it would
  # leave the crate's only end-to-end proof permanently skipped.
  #
  # Its own job because that extra Bevy variant is exactly why it does not
  # belong in `check`: sharing a job bought nothing (no shared build) and cost
  # 11 minutes of that job's budget.
  autopilot:
    name: autopilot example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers xvfb
      - name: Install Rust nightly toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Autopilot example
        env:
          RUST_BACKTRACE: full
        run: xvfb-run --auto-servernum cargo test -p nova_autopilot --test autopilot_example

  # The two configurations the `check` job above cannot see. They exist to catch
  # dead code and unused imports that only appear OUTSIDE `--features debug` on
  # the host target, which is precisely what a large refactor produces; the wasm
  # one also carries the panicking-std-API gate described on its own step. They
  # run in parallel with the gates above, so they cost no wall clock.
  #
  # Neither shares a build with `check`: `debug` flips bevy/track_location, and
  # wasm is a different target, so both would pay a full build inside that job
  # anyway. Separate jobs at least parallelise it.
  default-features:
    name: check / default features
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Build-tier deps only. Nothing here opens a window or renders, so the
      # runtime tier (Vulkan, mesa, Xvfb) the probe sweep needs is not required.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # --all-targets is load-bearing: the dead items this catches live in
      # examples/, which a bare `cargo check` never compiles.
      - name: Check default features
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --all-targets

  wasm:
    name: clippy / wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # No --all-targets: the examples are native harnesses and do not build
      # for wasm. This checks the lib graph the trunk bundle actually ships,
      # where an ungated host-only module shows up as dead code.
      #
      # nova_probe_cli, nova_channel and nova_bench are excluded, not stubbed:
      # the first is the HOST half of the run-harness (spawns child processes,
      # reads their artifacts), the second drives a headless app over
      # stdin/stdout, and the third referees an agent playing the game -
      # spawning that game by path and serving the agent a unix socket. None of
      # the three has any meaning in a browser. That exclusion is what lets
      # their modules carry no `cfg(not(target_arch = "wasm32"))` at all. The
      # root package reaches all three only through wasm-target-gated optional
      # dependencies (`probe`, `--channel` and `bench`), so this check never
      # pulls them in through the game either - `--workspace` builds a MEMBER
      # whether or not anything depends on it, which is the only reason they
      # have to be named here.
      #
      # clippy rather than check, and CLIPPY_CONF_DIR rather than a root
      # clippy.toml, because of ci/wasm-clippy/clippy.toml: it bans the std APIs
      # that COMPILE for wasm32 and then panic at runtime - a class of bug no
      # `cargo check` on this target can see, and a std `Instant::now` killed the
      # web build on load for a whole cycle. Those bans are only correct on this
      # target: natively `bevy::platform::time` re-exports std's clock, so the
      # same list would flag correct code in the `check` job above. Keeping the
      # config out of the repository root is what confines it to this job - do
      # not move it, and do not add a root clippy.toml that duplicates it.
      #
      # `-- -D warnings` instead of the old RUSTFLAGS: it matches the `check`
      # job, it is what promotes the clippy lints, and it leaves
      # .cargo/config.toml's `--cfg=web_sys_unstable_apis` in place (an env
      # RUSTFLAGS overrides the config's target rustflags outright, so the old
      # form silently built a different wasm graph than trunk does).
      - name: Clippy wasm32
        env:
          CLIPPY_CONF_DIR: ci/wasm-clippy
        run: >-
          cargo clippy --workspace --exclude nova_probe_cli --exclude nova_channel
          --exclude nova_bench --target wasm32-unknown-unknown -- -D warnings

  # The dependency-license gate. The shipped manifest
  # (credits/THIRD-PARTY-LICENSES.md) is GENERATED at build/release time, not
  # committed (cargo-about's output is not byte-stable, so a committed copy could
  # not be diff-checked). This job just runs the generation and lets it fail:
  # cargo-about exits non-zero if any dependency carries a license outside
  # about.toml's accepted permissive set, so a new copyleft/unknown-license dep
  # is caught on the PR that adds it. No project build needed - cargo-about only
  # reads `cargo metadata` and crate license files - so this is fast and separate
  # from the compile/test gate above.
  licenses:
    name: dependency license gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The first cargo invocation auto-installs the rust-toolchain.toml-pinned
      # toolchain that cargo-about's `cargo metadata` runs under.
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # Generation fails on any non-accepted license - that failure IS the gate.
      # The output itself is discarded here; the shipped copy is generated in the
      # release/deploy workflows.
      - name: Check dependency licenses
        run: cargo about generate about.hbs -o "${RUNNER_TEMP}/third-party-licenses.md"
