name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    # The correctness probe launches real gameplay subprocesses; probe gives
    # each one its own `--timeout`, but a wedged runner-level step would
    # otherwise hang up to GitHub's 6h cap. Fail fast instead.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Two tiers of system deps. BUILD needs the ALSA + udev headers Bevy links
      # against, plus wayland/xkb headers a transitive dep's build script
      # pkg-configs even when nothing opens a window. RUNTIME is what sets this
      # repo apart from a compile-only CI: the probe sweep actually LAUNCHES
      # every cataloged example (they use DefaultPlugins and open a real
      # window), so we also need a Vulkan loader plus mesa's software rasterizer
      # (lavapipe) to render with no GPU, and Xvfb to give winit an X display.
      # winit's X11 backend also dlopens libxkbcommon-x11.so.0 at runtime (the
      # -dev package only ships libxkbcommon.so), hence libxkbcommon-x11-0.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers xvfb

      # rust-toolchain.toml pins nightly with rustfmt + clippy; install it
      # explicitly so a toolchain problem surfaces here instead of being folded
      # into the first (slow) cargo invocation.
      - name: Install Rust nightly toolchain
        run: rustup toolchain install nightly --profile minimal -c rustfmt -c clippy

      # cache-on-failure matters here: while the example runs were flaky every
      # run failed, the cache never saved, and every run paid a ~25 min cold
      # build - which is what blew the job timeout.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The suite documented in AGENTS.md ("Build, run, test"), run as CI is now
      # the source of truth for it.
      - name: Formatting
        run: cargo fmt --check

      # One clippy pass, workspace-wide, with the debug feature on. `debug`
      # fans out to every crate's debug feature (nova_debug has none - it IS
      # the debug tooling - and cargo is fine with that), so this lints the
      # debug-gated code too. The default-features and wasm gaps are covered by
      # the two cheap `check` jobs below rather than by a second clippy pass,
      # which would cost a near-full second build on 2 cores.
      #
      # `-D warnings` is what makes this a gate rather than a report, and it is
      # what catches the unused imports and dead code a refactor leaves behind.
      # It also promotes `unfulfilled_lint_expectations`, so a stale
      # `#[expect(..)]` fails here - see CONVENTIONS.md rule 8.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features debug -- -D warnings

      # Every crate's tests, with the same feature set the smoke examples use.
      # That feature match is the whole point: `debug` flips bevy/track_location,
      # so testing with default features and then running examples with
      # `--features debug` rebuilds Bevy and everything downstream a second
      # time - the other half of what blew the job timeout. This step also
      # builds the example binaries (cargo test builds examples), so the probe
      # step below reuses them as-is. No DISPLAY is set here, and the tests in
      # this step launch nothing; this is the pure unit/integration gate.
      - name: Tests
        run: cargo test --workspace --features debug

      # The windowed run gate: correctness-only probe spawns EVERY cataloged
      # example under NOVA_AUTOPILOT/Xvfb (lavapipe renders) and grades process
      # exit, run completion, reached-Playing, invariants, and log cleanliness.
      # It skips the separate FPS and traced passes; full local/release probe
      # runs own performance evidence.
      # `aggregate_exit` returns FAILURE on anything past OK/WARN/UNPROBEABLE
      # (UNPROBEABLE is the sanctioned no-probe-plugin opt-out, still gated on
      # its smoke checks), so this is a blocking gate. It REPLACED tests/examples_smoke.rs (task
      # 20260805-185103 step 6): probe asserted a superset - it also grades
      # scene_baseline, which the smoke suite skipped - and one verdict
      # implementation beats two that could disagree.
      #
      # BLOCKING since 20260710-143138: the taffy panic (resolve.rs
      # unreachable, GitHub runners only) was observed deterministically on the
      # pre-rework 03_scenario and did not survive the 20260712-211352 examples
      # rework - the full reworked suite ran green on ubuntu-latest (run
      # 29283727248, 2026-07-13). If it ever resurfaces, this step fails loudly
      # with RUST_BACKTRACE=full and the investigation record lives in
      # tasks/20260710-143138/NOTES.md ("The taffy panic").
      - name: Probe correctness sweep
        env:
          RUST_BACKTRACE: full
          # Software rendering stretches the longest screenshot walk beyond
          # the harness's interactive 120s default, but it still fits under
          # probe's 180s process timeout.
          NOVA_AUTOPILOT_DEADLINE: 170
        # probe is the game binary's `probe` subcommand, which only exists
        # under --features debug. That flag is also what keeps this step on ONE
        # Bevy variant: probe builds each example itself with --features debug,
        # and the host binary's own graph (via nova_probe_cli's passthrough
        # down to bevy/track_location) matches it - default features would flip
        # track_location back off and pay for a second variant inside this
        # step, the cost the Tests step's comment is about. --out keeps run
        # directories off the checkout.
        run: >-
          xvfb-run --auto-servernum
          cargo run --features debug --
          probe run --all --correctness-only --out "$RUNNER_TEMP/probe-runs"

      # The reports and logs for whatever the sweep graded, green or not: a
      # failing check is diagnosed from its run.log, which the step output only
      # tails.
      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-runs
          path: ${{ runner.temp }}/probe-runs
          if-no-files-found: ignore
          retention-days: 7

      # nova_autopilot's own end-to-end proof: its `driven_app` example is a
      # standalone DefaultPlugins app driven Boot -> Flying -> Done, and this
      # asserts the exit status plus the harness log lines. Written with no
      # `--features` on purpose: `debug` is a nova-protocol feature that flips
      # bevy/track_location, and the nested `cargo run -p nova_autopilot`
      # resolves without it - so this costs ONE extra cached Bevy variant, and
      # the test binary and its nested run share that one graph. Never running
      # it would leave the crate's only end-to-end proof permanently skipped.
      - name: Autopilot example
        env:
          RUST_BACKTRACE: full
        run: xvfb-run --auto-servernum cargo test -p nova_autopilot --test autopilot_example

  # The two configurations the `check` job above cannot see, each a plain
  # `cargo check` rather than a clippy pass: they exist to catch dead code and
  # unused imports that only appear OUTSIDE `--features debug` on the host
  # target, which is precisely what a large refactor produces. They run in
  # parallel with the 60-minute gate above, so they cost no wall clock.
  #
  # Neither shares a build with `check`: `debug` flips bevy/track_location, and
  # wasm is a different target, so both would pay a full build inside that job
  # anyway. Separate jobs at least parallelise it.
  default-features:
    name: check / default features
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Build-tier deps only. Nothing here opens a window or renders, so the
      # runtime tier (Vulkan, mesa, Xvfb) the probe sweep needs is not required.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # --all-targets is load-bearing: the dead items this catches live in
      # examples/, which a bare `cargo check` never compiles.
      - name: Check default features
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --all-targets

  wasm:
    name: check / wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # No --all-targets: the examples are native harnesses and do not build
      # for wasm. This checks the lib graph the trunk bundle actually ships,
      # where an ungated host-only module shows up as dead code.
      #
      # nova_probe_cli is excluded, not stubbed: it is the HOST half of the
      # run-harness (spawns child processes, reads their artifacts) and has no
      # meaning in a browser. That exclusion is what lets its modules carry no
      # `cfg(not(target_arch = "wasm32"))` at all. The root package reaches it
      # only through a wasm-target-gated optional dependency (the `probe`
      # subcommand), so this check never pulls it in through the game either.
      - name: Check wasm32
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo check --workspace --exclude nova_probe_cli
          --target wasm32-unknown-unknown

  # The dependency-license gate. The shipped manifest
  # (credits/THIRD-PARTY-LICENSES.md) is GENERATED at build/release time, not
  # committed (cargo-about's output is not byte-stable, so a committed copy could
  # not be diff-checked). This job just runs the generation and lets it fail:
  # cargo-about exits non-zero if any dependency carries a license outside
  # about.toml's accepted permissive set, so a new copyleft/unknown-license dep
  # is caught on the PR that adds it. No project build needed - cargo-about only
  # reads `cargo metadata` and crate license files - so this is fast and separate
  # from the compile/test gate above.
  licenses:
    name: dependency license gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The first cargo invocation auto-installs the rust-toolchain.toml-pinned
      # toolchain that cargo-about's `cargo metadata` runs under.
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # Generation fails on any non-accepted license - that failure IS the gate.
      # The output itself is discarded here; the shipped copy is generated in the
      # release/deploy workflows.
      - name: Check dependency licenses
        run: cargo about generate about.hbs -o "${RUNNER_TEMP}/third-party-licenses.md"
