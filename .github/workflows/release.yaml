name: release-flow

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version - in the form of v1.2.3'
        required: true
        type: string

env:
  # The release asset names below (`<name>_<version>_<platform>.<ext>`) are
  # matched by filename suffix in web/src/downloads.ts to deep-link the landing
  # page download buttons. Renaming a `_windows.zip` / `_macOS.dmg` /
  # `_linux.tar.gz` asset means updating OS_ASSET_SUFFIX there too.
  GAME_EXECUTABLE_NAME: nova-protocol
  GAME_OSX_APP_NAME: NovaProtocol

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - name: Get tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
    outputs:
      version: ${{ inputs.version || steps.tag.outputs.tag }}

  # The two halves of the universal binary, built CONCURRENTLY. They used to be
  # two steps of one job, which made macOS the whole release's critical path:
  # 65.2 min for Apple Silicon plus 51.5 min for x86 was a 120.4-minute job
  # (v0.10.0, run 31733347497) while Linux finished in 21.6. Nothing links the
  # two builds - `lipo` just needs both files - so they are a matrix now and the
  # job below joins them. Costs one extra runner and no extra build time; this
  # repository is public, so its GitHub-hosted minutes are free.
  #
  # Note the cost is the `dist` profile, not the platform: fat `lto = true` with
  # `codegen-units = 1`. Cheapening it would cut every platform at once, but it
  # changes the SHIPPED binary, so that is a separate call from this one.
  build-macOS-binary:
    name: build-macOS (${{ matrix.target }})
    runs-on: macos-latest
    needs: get-version
    strategy:
      # One failed arch should still let the other finish, so a re-run only
      # needs the half that broke.
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      # macOS 11.0 Big Sur is the first version to support universal binaries
      MACOSX_DEPLOYMENT_TARGET: 11.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # build.rs only embeds the Windows icon; dropping it here skips building
      # embed-resource for a target that never uses it.
      - name: Remove build script
        run: |
          rm build.rs
      # rust-toolchain.toml pins a dated nightly and OVERRIDES whatever else is
      # installed, so the release binaries have always been built with it - the
      # old `dtolnay/rust-toolchain@master with: toolchain: stable` steps
      # installed a compiler this build then ignored, and the target they
      # registered went to that unused stable (the x86 cross died with E0463
      # until a second `rustup target add` fixed it). Resolve the pin, then add
      # the target to the toolchain that actually compiles.
      - name: Resolve the pinned toolchain and add the target
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - name: Build release
        run: |
          SDKROOT=$(xcrun -sdk macosx --show-sdk-path) cargo build --profile dist --target=${{ matrix.target }}
      - name: Upload arch binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: target/${{ matrix.target }}/dist/${{ env.GAME_EXECUTABLE_NAME }}
          retention-days: 1
          if-no-files-found: error

  build-macOS:
    runs-on: macos-latest
    needs: [get-version, build-macOS-binary]
    env:
      VERSION: ${{needs.get-version.outputs.version}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download arch binaries
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: arch
      - name: Create Universal Binary
        run: |
          mkdir -p target/dist
          lipo -create -output target/dist/${{ env.GAME_EXECUTABLE_NAME }} arch/macos-aarch64-apple-darwin/${{ env.GAME_EXECUTABLE_NAME }} arch/macos-x86_64-apple-darwin/${{ env.GAME_EXECUTABLE_NAME }}
          chmod +x target/dist/${{ env.GAME_EXECUTABLE_NAME }}
          lipo -info target/dist/${{ env.GAME_EXECUTABLE_NAME }}
      # Generate the third-party dependency-license manifest into credits/ so the
      # copy below bundles it. Not committed (cargo-about output is not stable);
      # regenerated fresh here so it always matches the shipped dependency graph.
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate third-party license manifest
        run: cargo about generate about.hbs -o credits/THIRD-PARTY-LICENSES.md
      - name: Create release
        run: |
          mkdir -p build/macos/src/Game.app/Contents/MacOS/assets
          cp -r assets/ build/macos/src/Game.app/Contents/MacOS/assets
          cp -r credits/ build/macos/src/Game.app/Contents/MacOS/credits
          cp target/dist/${{ env.GAME_EXECUTABLE_NAME }} build/macos/src/Game.app/Contents/MacOS/
          mv build/macos/src/Game.app build/macos/src/${{ env.GAME_OSX_APP_NAME }}.app
          ln -s /Applications build/macos/src/
          hdiutil create -fs HFS+ -volname "${{ env.GAME_OSX_APP_NAME }}" -srcfolder build/macos/src ${{ env.GAME_EXECUTABLE_NAME }}.dmg
      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.GAME_EXECUTABLE_NAME }}.dmg
          asset_name: ${{ env.GAME_EXECUTABLE_NAME }}_${{ env.VERSION }}_macOS.dmg
          release_name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          overwrite: true

  build-linux:
    runs-on: ubuntu-latest
    needs: get-version
    env:
      VERSION: ${{needs.get-version.outputs.version}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # rust-toolchain.toml pins a dated nightly and overrides whatever else is
      # installed, so this build has always used it - installing stable here
      # only ever cost a download the build then ignored. Resolve the pin.
      - name: Resolve the pinned toolchain
        run: rustup show active-toolchain
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev
      - name: Build release
        run: |
          cargo build --profile dist
      - name: Prepare release
        run: |
          chmod +x target/dist/${{ env.GAME_EXECUTABLE_NAME }}
          mv target/dist/${{ env.GAME_EXECUTABLE_NAME }} .
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate third-party license manifest
        run: cargo about generate about.hbs -o credits/THIRD-PARTY-LICENSES.md
      - name: Bundle release
        run: |
          tar -czf ${{ env.GAME_EXECUTABLE_NAME }}_linux.tar.gz ${{ env.GAME_EXECUTABLE_NAME }} assets credits
      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.GAME_EXECUTABLE_NAME }}_linux.tar.gz
          asset_name: ${{ env.GAME_EXECUTABLE_NAME }}_${{ env.VERSION }}_linux.tar.gz
          release_name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          overwrite: true

  build-windows:
    runs-on: windows-latest
    needs: get-version
    env:
      VERSION: ${{needs.get-version.outputs.version}}
      BUILD_INSTALLER: ${{ false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # rust-toolchain.toml pins a dated nightly and overrides whatever else is
      # installed, so this build has always used it - installing stable here
      # only ever cost a download the build then ignored. Resolve the pin.
      - name: Resolve the pinned toolchain
        run: rustup show active-toolchain
      - name: Install dotnet
        if: ${{ env.BUILD_INSTALLER }}
        uses: actions/setup-dotnet@v3
        with:
          global-json-file: build/windows/installer/global.json
      - name: Build release
        run: |
          cargo build --profile dist
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate third-party license manifest
        run: cargo about generate about.hbs -o credits/THIRD-PARTY-LICENSES.md
      - name: Prepare release
        run: |
          mkdir target/dist/assets && cp -r assets target/dist/assets
          mkdir target/dist/credits && cp -r credits target/dist/credits
      - name: Zip release
        uses: vimtor/action-zip@v1.1
        with:
          files: target/dist/assets/ target/dist/credits/ target/dist/${{ env.GAME_EXECUTABLE_NAME }}.exe
          dest: ${{ env.GAME_EXECUTABLE_NAME }}_windows.zip
      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.GAME_EXECUTABLE_NAME }}_windows.zip
          asset_name: ${{ env.GAME_EXECUTABLE_NAME }}_${{ env.VERSION }}_windows.zip
          tag: ${{ env.VERSION }}
          overwrite: true

  build-web:
    runs-on: ubuntu-latest
    needs: get-version
    env:
      VERSION: ${{needs.get-version.outputs.version}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # rust-toolchain.toml pins a dated nightly and overrides whatever else is
      # installed, so this build has always used it - installing stable here
      # only ever cost a download the build then ignored. Resolve the pin.
      - name: Resolve the pinned toolchain
        run: rustup show active-toolchain
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev
      - name: Install trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: latest
      - name: Add wasm target
        run: |
          rustup target add wasm32-unknown-unknown
      # Generate into credits/ BEFORE the Trunk build, so `copy-dir credits`
      # bundles the manifest into dist/.
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate third-party license manifest
        run: cargo about generate about.hbs -o credits/THIRD-PARTY-LICENSES.md
      - name: Build Release
        run: |
          trunk build --release
      - name: Optimize Wasm
        uses: NiklasEi/wasm-opt-action@v2
        with:
          file: dist/*.wasm
      - name: Zip release
        uses: vimtor/action-zip@v1.1
        with:
          files: dist/
          dest: ${{ env.GAME_EXECUTABLE_NAME }}_web.zip
      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.GAME_EXECUTABLE_NAME }}_web.zip
          asset_name: ${{ env.GAME_EXECUTABLE_NAME }}_${{ env.VERSION }}_web.zip
          release_name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          overwrite: true
