[build]
public_url = "./"

# After Trunk copies `assets/` into the staging dir, generate a default `.meta`
# sidecar for every asset that lacks one, so `AssetMetaCheck::Always` (see
# nova_core::assets_plugin) never has to fetch a missing meta on the web. Without
# this, `trunk serve` (and any SPA-fallback host) answers a missing `.meta` with
# `200 OK` + an HTML page, which Bevy tries to parse as RON and fails on, and the
# asset never loads. post_build runs against $TRUNK_STAGING_DIR BEFORE Trunk
# moves staging into dist/, and Trunk blocks on the hook, so the fresh sidecars
# ride along to dist. nova_meta_gen reads TRUNK_STAGING_DIR itself and writes into
# <staging>/assets. See the `asset-meta-always-web-cost` lesson in LESSONS.md. (Cost: the
# native tool compiles Bevy once per fresh checkout; cached thereafter.)
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--quiet", "-p", "nova_meta_gen"]

[serve]
# Default for a bare `trunk serve`. The preview scripts override it with
# TRUNK_SERVE_PORT so several worktrees can serve at once (see
# scripts/serve-web.sh).
port = 8080

# Local mod-portal testing is configured through the environment, NOT a [[proxy]]
# entry here. Trunk merges config-file proxies with TRUNK_SERVE_PROXY_BACKEND and
# then panics on the duplicate /mods route, so a fixed entry would make
# `scripts/serve-web.sh` unstartable.
#
# Why a proxy at all (dev only - proxies apply to `trunk serve`, never
# `trunk build`, so this has ZERO effect on the deployed site): it serves the
# generated portal SAME-ORIGIN under the trunk dev server, so the wasm Explore
# tab fetches `<game origin>/mods/...` with no cross-origin `?portal=` override
# (which the browser blocks on CORS).
#
# `scripts/serve-web.sh` wires this up for you. For the game-only loop:
#   nix develop -c scripts/serve-mods.sh          # prints its port
#   TRUNK_SERVE_PROXY_BACKEND=http://127.0.0.1:<port>/mods nix develop -c trunk serve
# See web/src/create/publish-a-mod.md, "Local development".
