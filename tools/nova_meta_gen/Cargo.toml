[package]
name = "nova_meta_gen"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
description = "Default `.meta` sidecar generator. Boots a headless, GPU-free Bevy app with the game's exact asset loaders and writes a default `.meta` next to every asset that lacks one, so `AssetMetaCheck::Always` never has to fetch a missing meta on the web. Run as a Trunk post_build hook against the staging dir."

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
# Default features pull in bevy_image/bevy_gltf/bevy_shader/bevy_audio (and thus
# their asset loaders). nova_modding supplies the three custom RON loaders
# (content/bundle/catalog.ron) AND, transitively via nova_gameplay, unifies the
# bevy `wav` feature into this crate's dependency subgraph so AudioLoader claims
# `.wav`. Without that unification `cargo run -p nova_meta_gen` would build bevy
# without wav and skip every `.wav` sidecar.
bevy = { version = "0.19.0" }
nova_modding = { path = "../../crates/nova_modding" }
# The UI/NOVA OS font is a `.ttf` (the single Iosevka Term Regular face, task
# 20260729-000956), claimed by Bevy's built-in `bevy::text::FontLoader` - no
# bespoke loader is needed anymore, so the direct nova_gameplay dep was dropped.
# bevy's default features include `bevy_text`, which supplies that loader; the
# generator registers it below so the font gets a `...ttf.meta` naming it.
# Without a sidecar the web build (`AssetMetaCheck::Always`) fails the
# missing-meta fetch and all NOVA OS text is invisible (task 20260727-172205).

[dev-dependencies]
tempfile = { version = "3" }

[lints]
workspace = true
