[package]
name = "nova-protocol"
version = { workspace = true }
edition = { workspace = true }
authors = ["jercan_alex27@yahoo.com"]
license = "MIT"
homepage = "https://github.com/alexjercan/nova-protocol"
description = "A 3D space shooter game made with Bevy"
categories = ["games"]
exclude = ["dist", "build", "assets", "credits"]
# Not published to crates.io (this is the game binary); also marks it first-party
# so cargo-about's `[private] ignore` keeps it out of the third-party manifest.
publish = false
# The examples live in category subdirectories (bevy-repo style: purpose dirs,
# plain slug names), which cargo's auto-discovery cannot see - it only looks at
# examples/*.rs and examples/*/main.rs. Discovery off makes the [[example]]
# catalog below the SINGLE source of truth: a stray file can never become a
# phantom target, and a missing block means the example does not build at all
# (the catalog_matches_disk test in crates/nova_probe_cli/tests/catalog_drift.rs
# pins catalog == disk). Task 20260719-193728.
autoexamples = false

[lib]
path = "src/lib.rs"

# THE EXAMPLE-CATEGORY CONTRACT (see autoexamples above). A category is a
# promise about WHO an example is for. It is NOT a run policy: every
# cataloged example is a probe target, and what one can be JUDGED on is its
# own runtime declaration (nova_probe::contract), not its directory. An
# example that wires no probe plugin grades UNPROBEABLE - the sanctioned
# opt-out from claim grading, no skip list - but it is still spawned by
# `probe run --all`, so it MUST exit cleanly under NOVA_AUTOPILOT within the
# deadline with a clean log (a hang or panic is a FAIL, opted out or not).
# THREE categories, split by AUDIENCE (task 20260818-221103):
#
#   playable/    A HUMAN. Somebody loads it and does the thing it demonstrates
#                - flies the hull, works the gallery, drags the widget. The
#                affordance is wired OUTSIDE the NOVA_AUTOPILOT gate, so a
#                plain `cargo run --example` reaches it.
#                probe: whatever the runtime contract declares, exactly as
#                anywhere else. Autopilot here is a SECOND driver, for
#                captures and for the run gate, never the only one.
#                not this category: an example whose only affordance is the
#                free-fly camera the scenario loader hands every cameraless
#                scene. Looking at a rig is not playing one.
#   systems/     CORRECTNESS, for the probe. A range that asserts: it stages a
#                behavior and panics when the behavior is wrong. Every claim it
#                makes is named as an `outcome: <slug>` probe marker beside its
#                assert and listed on the roster in
#                crates/nova_probe_cli/tests/catalog_drift.rs, so a deleted
#                assertion fails a test instead of quietly passing.
#                probe: correctness passes; a range that wires the capture
#                also gets an automatic frame-time pass.
#                not this category: anything whose product is a frame for
#                human eyes rather than a verdict.
#   screenshots/ CONTENT, for the website and the wiki. A producer that
#                captures: page and wiki frames, and webm loops. The name says
#                which - `screenshot_*` stills, `loop_*` video - and a
#                producer takes at most THREE frames, because a long walk
#                cannot hold the same result twice.
#                probe: the WALK is graded like any other autopilot script;
#                what it PRODUCED is judged by human eyes, which is a claim
#                probe never makes. A producer that also wires the capture
#                gets a frame-time pass on top - the pass set follows the
#                runtime contract, never the directory.
#                not this category: anything whose verdict is an assert, and
#                anything a human is meant to drive.
#
# Blocks are listed in reading order within each category.
# playable/ - the hulls first: a rig you fly and shoot with.
[[example]]
name = "carve_asteroids"
path = "examples/playable/carve_asteroids.rs"

# The same generator `wfc_ships` poses in a row (shared/wfc.rs) with the safety
# off: a `--ship` roster of collapsed hulls on two allegiances under the
# campaign's AI pilot, in a dressed arena, fighting with all four weapon
# flavours - and a `:player` slot that puts YOU in one of them, which is why it
# refuses to run under NOVA_AUTOPILOT with that slot filled.
[[example]]
name = "wfc_arena"
path = "examples/playable/wfc_arena.rs"

# Then the benches and galleries: a roster held still, and keys to work it.
#
# Frames the catalog's link points as a GENERATOR rather than a lineup: the
# sockets are read as wave-function-collapse adjacency rules and a row of
# random hulls is grown from them, lint-checked before it is posed. `R`
# re-rolls the row, so the seed stream is something a person walks.
[[example]]
name = "wfc_ships"
path = "examples/playable/wfc_ships.rs"

# A fixed roster of hand-placed structures - the owner's L, runs, a T, a cross,
# a fitted hull - clad, named and held still, with the skin report printed per
# subject so a render is judged next to its numbers (task 20260816-142330).
[[example]]
name = "shape_bench"
path = "examples/playable/shape_bench.rs"

# The shape bench at ship scale: a roster of hand-placed BUILDING BLOCK ships
# - destroyer wedge, spine freighter, carrier deck - clad, named and held
# still, judged against "this can be an actual ship" (task 20260816-203837).
[[example]]
name = "block_bench"
path = "examples/playable/block_bench.rs"

# Every fixture model the merged styles own, stood in named rows grouped by
# style on pedestal plates, with an idle orbit and a focus turntable - the
# catalog a greeble is judged on as an object before placement rules touch it
# (task 20260816-203846).
[[example]]
