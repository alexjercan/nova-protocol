#
# NAMING IS THE CONTRACT: `screenshot_*` produces STILLS, `loop_*` produces
# VIDEO, so what a producer makes is readable from its name alone.
#
# One producer captures ONE thing, in at most THREE frames. A long scripted
# walk cannot hold the same result twice: the fat sets these replace strung a
# dozen captures onto one script, so a beat that drifted took every frame after
# it with it. Duplication between producers is the accepted price - several
# below stage the same set, and each is short enough to read in one screen.
# The scene builders they share live in examples/screenshots/shared/.

