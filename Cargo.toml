[package]
name = "nova-protocol"
version = { workspace = true }
edition = { workspace = true }
authors = ["jercan_alex27@yahoo.com"]
license = "MIT"
homepage = "https://github.com/alexjercan/nova-protocol"
description = "A 3D space shooter game made with Bevy"
categories = ["games"]
exclude = ["dist", "build", "assets", "credits"]
# Not published to crates.io (this is the game binary); also marks it first-party
# so cargo-about's `[private] ignore` keeps it out of the third-party manifest.
publish = false
# The examples live in category subdirectories (bevy-repo style: purpose dirs,
# plain slug names), which cargo's auto-discovery cannot see - it only looks at
# examples/*.rs and examples/*/main.rs. Discovery off makes the [[example]]
# catalog below the SINGLE source of truth: a stray file can never become a
# phantom target, and a missing block means the example does not build at all
# (the catalog_matches_disk test in crates/nova_probe_cli/tests/catalog_drift.rs
# pins catalog == disk). Task 20260719-193728.
autoexamples = false

[lib]
path = "src/lib.rs"

# THE EXAMPLE-CATEGORY CONTRACT (see autoexamples above). A category is a
# promise about what its examples prove. It is NOT a run policy: every
# cataloged example is a probe target, and what one can be JUDGED on is its
# own runtime declaration (nova_probe::contract), not its directory. An
# example that wires no probe plugin grades UNPROBEABLE - the sanctioned
# opt-out from claim grading, no skip list - but it is still spawned by
# `probe run --all`, so it MUST exit cleanly under NOVA_AUTOPILOT within the
# deadline with a clean log (a hang or panic is a FAIL, opted out or not).
# The five settled categories:
#
#   sections/    proves one ship section's behavior end to end.
#                probe: correctness passes only.
#                not this category: anything spanning two sections.
#   systems/     proves a whole system's behavior on a code-built fixture.
#                probe: correctness passes only.
#                not this category: anything that needs shipped content to
#                stand up, or that measures rather than asserts.
#   stress/      the ONLY home for frame-time claims: a steady-state scene
#                built to be measured and compared against a baseline.
#                probe: correctness + an automatic frame-time pass.
#                not this category: anything that ends on a script rather
#                than holding a load (it cannot fill a capture window).
#   ui/          proves a staged UI flow: layout, navigation, real text
#                measure.
#                probe: correctness passes only.
#                not this category: anything whose subject is simulation
#                rather than the interface over it.
#   screenshots/ produces frames for the website and the wiki.
#                probe: correctness passes only - the WALK is graded like any
#                other autopilot script; the FRAME it captures is judged by
#                human eyes, which is a claim probe never makes.
#                not this category: anything that asserts, rather than
#                captures.
#
# Blocks are listed in curriculum reading order within each category.
# sections/ - one example per ship section, the correctness curriculum.
[[example]]
name = "controller_section"
path = "examples/sections/controller_section.rs"

[[example]]
name = "thruster_section"
path = "examples/sections/thruster_section.rs"

[[example]]
name = "hull_section"
path = "examples/sections/hull_section.rs"

[[example]]
name = "turret_section"
path = "examples/sections/turret_section.rs"

[[example]]
name = "torpedo_section"
path = "examples/sections/torpedo_section.rs"

# systems/ - code-built fixtures for the cross-cutting gameplay systems, at a
# coarser grain than sections/. Every fixture is a `ScenarioConfig` built in
# Rust and loaded with `LoadScenario`, so the compiler catches scenario-grammar
# changes and no shipped story content is reachable from here.
[[example]]
name = "scenario_grammar"
path = "examples/systems/scenario_grammar.rs"

[[example]]
name = "player_path"
path = "examples/systems/player_path.rs"

[[example]]
name = "outcomes"
path = "examples/systems/outcomes.rs"

[[example]]
name = "neutralized_quiet"
path = "examples/systems/neutralized_quiet.rs"

# ui/ - staged UI flows with their own autopilot timelines.
[[example]]
name = "widget_zoo"
path = "examples/ui/widget_zoo.rs"

[[example]]
name = "editor"
path = "examples/ui/editor.rs"

[[example]]
name = "hud_range"
path = "examples/ui/hud_range.rs"

[[example]]
name = "menu_newgame"
path = "examples/ui/menu_newgame.rs"

[[example]]
name = "menu_scenarios"
path = "examples/ui/menu_scenarios.rs"

# stress/ - the ONLY home for frame-time claims: steady-state scenes built to be
# measured and compared against a baseline (probe run stress). Each run
# also asserts, so a scale sweep proves "nothing breaks at scale" alongside its
# number.
[[example]]
name = "scene_baseline"
path = "examples/stress/scene_baseline.rs"

[[example]]
name = "many_bodies"
path = "examples/stress/many_bodies.rs"

[[example]]
name = "many_sections"
path = "examples/stress/many_sections.rs"

[[example]]
name = "many_projectiles"
path = "examples/stress/many_projectiles.rs"

# screenshots/ - capture producers for the website (gen-web-screenshots.py).
[[example]]
name = "screenshot_scene"
path = "examples/screenshots/screenshot_scene.rs"

[[example]]
name = "screenshot_ui"
path = "examples/screenshots/screenshot_ui.rs"

[[example]]
name = "screenshot_combat"
path = "examples/screenshots/screenshot_combat.rs"

[[example]]
name = "screenshot_nova_os"
path = "examples/screenshots/screenshot_nova_os.rs"

[[example]]
name = "screenshot_sections"
path = "examples/screenshots/screenshot_sections.rs"

[[example]]
name = "screenshot_flight"
path = "examples/screenshots/screenshot_flight.rs"

[[example]]
name = "render_scale_shot"
path = "examples/screenshots/render_scale_shot.rs"

[[example]]
name = "parts_viewer"
path = "examples/screenshots/parts_viewer.rs"

# Frames the catalog's link points as a GENERATOR rather than a lineup: the
# sockets are read as wave-function-collapse adjacency rules and a row of
# random hulls is grown from them, lint-checked before it is posed.
[[example]]
name = "wfc_ships"
path = "examples/screenshots/wfc_ships.rs"

# The same generator (shared/wfc.rs) with the safety off: two collapsed hulls
# on opposing allegiances under the campaign's AI pilot, in a dressed arena -
# the flyability bench for wfc ships and the skin's combat-motion showcase.
[[example]]
name = "wfc_arena"
path = "examples/screenshots/wfc_arena.rs"

# A fixed roster of hand-placed structures - the owner's L, runs, a T, a cross,
# a fitted hull - clad, named and held still, with the skin report printed per
# subject so a render is judged next to its numbers (task 20260816-142330).
[[example]]
name = "shape_bench"
path = "examples/screenshots/shape_bench.rs"

# The compare_* producers frame art candidates for human judgment (task
# 20260812-100256) - the category's promise verbatim, with the owner's eyes on
# the frames instead of the website's. Interactive when hand-run (number keys
# retexture the focus subject); under NOVA_AUTOPILOT they walk, capture and
# exit like any other producer.
[[example]]
name = "compare_asteroids"
path = "examples/screenshots/compare_asteroids.rs"

[[example]]
name = "compare_planets"
path = "examples/screenshots/compare_planets.rs"

# Inherit the workspace clippy allows (type_complexity, too_many_arguments) for
# the root package too, so the lib, binary and examples match the crates' policy.
[lints]
workspace = true

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
nova_core = { path = "crates/nova_core" }

# The dev-tool subcommands of the game binary (task record: this session,
# 2026-08-11): `cargo run content ...` is the authoring CLI, `cargo run
# --features debug probe ...` the run-harness host. Both are target-gated off
# wasm - the trunk bundle ships neither, and nova_probe_cli has no wasm build
# at all (it spawns child processes; CI's wasm job keeps excluding it).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nova_authoring = { path = "crates/nova_authoring" }
# Optional: only the `debug` feature links the probe host into the game
# binary, so release/dist builds never carry it.
nova_probe_cli = { path = "crates/nova_probe_cli", optional = true }

[dev-dependencies]
avian3d = { version = "0.7" }
bevy = { version = "0.19.0" }
# The stress/ examples use the frame-time capture harness, and the
# autopilot examples push run-timeline markers - both live in nova_probe (the
# in-game half of the run-harness, not shipped with the game binary; the host
# half is nova_probe_cli, which nothing here links). serde_json builds the
# markers' payloads (the timeline speaks JSON).
nova_probe = { path = "crates/nova_probe" }
# The harness presets and `shoot`, the one capture idiom. Reached DIRECTLY
# rather than through `nova_protocol::nova_debug`, which only exists under the
# `debug` feature.
nova_debug = { path = "crates/nova_debug" }
# widget_zoo example renders the nova_ui skin-aware widget set directly.
nova_ui = { path = "crates/nova_ui" }
# wfc_ships seeds its collapse from a pinned StdRng, the same generator the
# scenario engine's scatter uses - same crate, same version, same rolls.
rand = { version = "0.10.2" }
serde_json = { version = "1" }
bevy_enhanced_input = { version = "0.26.0" }

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1
# Keep `cargo test`/`--all-targets` peak RAM down: cargo links one Bevy+avian
# binary per target (16 lib + 27 integration test + 26 example + 5 bin), and
# rust-lld (the nightly default linker) peaks 2.94 GB on a 444 MB test binary
# and 2.93 GiB on a 582 MB example (both `time -v` at -j1, unfixed profile).
# Cargo's default -j is nproc, so on a 24-core box
# that is ~70 GB of concurrent linkers against 31 GB of RAM - hence the
# `jobs` cap in .cargo/config.toml, which is what actually bounds the peak.
#
# `unpacked` diverts 9.6 GB of DWARF into .dwo files that the linker never
# reads - measured (65,556 files: 6.96 GB first-party, 2.64 GB dependency),
# and the reason it must NOT be set to "off". Re-derive that split on an
# UNFIXED tree if you ever need it: with `package."*" debug = false` below in
# place, dependencies emit no .dwo at all and the measurement reads backwards.
# It cannot move line tables though (.debug_line/.debug_ranges stay in the .o),
# so it does not compose with `line-tables-only`: ~274 MB of DWARF still lands
# in every binary. That residue is what `[profile.test] debug = 0` below drops
# for test targets. Kept here for the game build, where `cargo run` panic
# backtraces want the line numbers.
split-debuginfo = "unpacked"
debug = "line-tables-only"

# Enable high optimizations for dependencies (incl. Bevy), but not for our code.
#
# `debug = false` drops DEPENDENCY debuginfo at the source, including the line
# tables that split-debuginfo cannot externalize. It only bites on DEV-profile
# builds - `cargo build`/`cargo run`, including `--example` - because everything
# `cargo test` links already goes through `[profile.test] debug = 0` below.
# Measured on `cargo build --example thruster_section -j1`: peak RSS 2.93 ->
# 2.16 GiB, binary 582 -> 369 MB, embedded DWARF 262.2 -> 49.0 MB. The same
# measurement on the full `cargo test --workspace --features debug` suite moved
# the peak 8.07 -> 8.19 GiB, i.e. nothing - do not expect this knob to help
# there, it is not what it is for.
# First-party frames keep file and line, since `[profile.dev]` above still
# applies to our own crates; only dependency frames lose them.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Test targets carry no debuginfo at all. Inheriting the dev profile leaves
# ~274 MB of line tables in each of the ~43 lib+integration-test binaries for
# rust-lld to merge. Measured on nova_core's test binary with
# `time -v cargo test --lib -p nova_core --no-run -j1`: peak RSS 2.94 GB -> 1.68
# GiB (-40%), binary 444 MB -> 158 MB, and `readelf -S` goes from 10 `.debug_*`
# sections to none. -40%, not "half" - an earlier version of this comment
# claimed a halving it never measured.
# Not redundant with `package."*" debug = false` above: that knob alone leaves
# 48 MB of first-party line tables and lands at 1.84 GiB; this one alone gets
# 1.68 GiB, and both together 1.66 GiB. They cover different profiles, so keep
# both - the pair is not additive and neither replaces the other.
# The cost is line numbers in test panic backtraces - function names survive,
# and a test worth debugging can be re-run under the dev-profile examples or
# with this line commented out.
# This DOES cover example targets: `cargo test` builds examples with the TEST
# profile, and only `cargo build`/`cargo run --example` use the dev profile.
# Measured on `thruster_section`: 582 MB / 262.2 MB DWARF under `cargo build
# --example`, 352 MB / 0 MB when built by `cargo test`.
[profile.test]
debug = 0

# This is used by trunk as it doesn't support custom profiles: https://github.com/trunk-rs/trunk/issues/605
# xbuild also uses this profile for building android AABs because I couldn't find a configuration for it
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Profile for the samply flamegraph pass (probe run --samply): full DWARF
# kept IN the binary so samply can symbolicate every frame of our code - the
# dev profile's line-tables-only + unpacked split (above) starves the
# symbolicator and leaves flamegraphs full of raw addresses. The RAM concern
# behind the dev settings is about linking MANY test/example binaries at once;
# this profile builds ONE example at a time, so a single fully-fat binary is
# affordable. Frame pointers (the other half of readable stacks) cannot be set
# in a cargo profile - the script passes -C force-frame-pointers=yes via
# RUSTFLAGS, which is also why this profile's cache only ever sees that flag.
[profile.profiling]
inherits = "dev"
debug = true
split-debuginfo = "off"

# Mirror the dev profile's dependency optimization explicitly (package
# overrides do not ride along with `inherits`).
[profile.profiling.package."*"]
opt-level = 3

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "1"

[features]
# `debug` also links the probe host (the `probe` subcommand) and switches its
# passthrough on, so the probe binary and the children it builds with
# `--features debug` share one bevy variant (bevy/track_location).
debug = [
  "nova_core/debug",
  "bevy/track_location",
  "dep:nova_probe_cli",
  "nova_probe_cli?/debug",
]
dev = ["debug"]
# The automatic PROFILED pass: bevy's per-system spans are
# compiled in only under bevy/trace, and bevy/trace_chrome adds the chrome-
# trace writer (output path via the TRACE_CHROME env var). Tracing overhead
# contaminates frame times, so never combine a trace build with an FPS
# capture - two passes, one clean, one profiled.
trace = ["bevy/trace", "bevy/trace_chrome"]

[workspace.lints.rust]
# dead_code = "allow"
# unused_variables = "allow"
# unused_imports = "allow"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[workspace.package]
edition = "2021"
version = "0.10.0"
license = "MIT"

[workspace]
members = [
  "crates/nova_assets",
  # The offline content toolchain (builders + `content` CLI + lint walk).
  # Originally carved out of nova_assets so the game never linked it; since
  # the CLI-unification (2026-08-11) the root package DOES link it - it backs
  # the game binary's `content` subcommand (native targets only, see the
  # root [target...] dependency block). The carve-out still pays for itself:
  # nova_assets stays the runtime asset stack, authoring stays one crate.
  "crates/nova_authoring",
  "crates/nova_autopilot",
  "crates/nova_core",
  "crates/nova_debug",
  "crates/nova_editor",
  "crates/nova_events",
  # The `EventKind` derive for `nova_events::engine`, and its only consumer.
  "crates/nova_events_macros",
  "crates/nova_gameplay",
  "crates/nova_hud",
  "crates/nova_info",
  "crates/nova_menu",
  "crates/nova_mod_format",
  "crates/nova_modding",
  "crates/nova_os",
  "crates/nova_os_ui",
  # The wasm frame-time app perf.html builds. Its own crate because it is an
  # APP that links the whole game - `nova_probe` links INTO the game.
  "crates/nova_perf_web",
  "crates/nova_probe",
  "crates/nova_probe_cli",
  "crates/nova_scenario",
  "crates/nova_ship",
  "crates/nova_ui",
  # Web-build tooling, not a game crate. `nova_meta_gen` stays a workspace
  # MEMBER (so Cargo's feature unification auto-pins its Bevy version AND
  # features - the `wav` feature via nova_modding -> nova_gameplay - to the
  # game's), but lives under tools/. It is never a game dependency, so a bare
  # `cargo build`/`run` of the root package does not compile it; it is reached
  # explicitly by `cargo run -p nova_meta_gen` (Trunk post_build) and by CI's
  # `--workspace`. See tasks/20260718-152255/SPIKE.md (round 2).
  #
  # NB: no `default-members` here on purpose. The root Cargo.toml is a PACKAGE
  # (nova-protocol, the game), so a bare `cargo run`/`build` at the repo root
  # targets the game binary. Setting `default-members` to the crate list broke
  # that - it made bare `cargo run` resolve across all members and launch the
  # `probe` bin instead of the game (task 20260721-151934). meta_gen is already
  # skipped by bare builds (not a game dep), so default-members bought nothing.
  "tools/nova_meta_gen",
]
resolver = "2"
