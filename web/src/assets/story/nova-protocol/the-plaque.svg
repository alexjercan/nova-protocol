  <rect x="1180" y="250" width="560" height="300" rx="6" fill="#8f8656" stroke="#3e4130" stroke-width="5"/><rect x="1190" y="260" width="540" height="280" rx="3" fill="none" stroke="#3e4130" stroke-width="2" opacity=".7"/><circle cx="1202" cy="272" r="7" fill="#3e4130"/><circle cx="1202" cy="528" r="7" fill="#3e4130"/><circle cx="1718" cy="272" r="7" fill="#3e4130"/><circle cx="1718" cy="528" r="7" fill="#3e4130"/><text x="1460.0" y="326.0" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="40" font-weight="700" letter-spacing="7.199999999999999" text-anchor="middle" fill="#06170f">DORIAN PELL</text><text x="1460.0" y="367.0" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="20" font-weight="400" letter-spacing="3.5999999999999996" text-anchor="middle" fill="#06170f">BOAT DECK, EWI MERIDIAN</text><text x="1460.0" y="401.3" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="22" font-weight="700" letter-spacing="3.96" text-anchor="middle" fill="#06170f">LOST IN RESCUE</text><text x="1460.0" y="434.2" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="20" font-weight="400" letter-spacing="3.5999999999999996" text-anchor="middle" fill="#06170f">"ALL HANDS, TENDERS AWAY"</text><text x="1460.0" y="461.59999999999997" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="16" font-weight="400" letter-spacing="2.88" text-anchor="middle" fill="#06170f">WE REMEMBER OUR OWN</text>
