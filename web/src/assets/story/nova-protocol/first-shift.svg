  <g fill="#ffb84a" filter="url(#glow)"><circle cx="1070" cy="405" r="7"/><circle cx="1030" cy="430" r="7"/><circle cx="990" cy="455" r="7"/><circle cx="950" cy="480" r="7"/></g>
  <text x="70" y="90" fill="#b9ffc9" font-family="monospace" font-size="27" letter-spacing="10">ROUTINE / RELEASED</text>
  <text x="965" y="820" fill="#ff4e42" font-family="monospace" font-size="27" letter-spacing="9">NO FLEET CODE</text>
