<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
  <title id="title">Aquila: exterior concept</title>
  <desc id="description">An atmospheric, original freight-port proposal. Rotating residential sections rise above a broad handling spine. Cargo blocks, berthing arms and two freighters occupy the foreground, with Saturn's limb and rings behind. Station and ship forms, scale and orbital position are proposals. The image does not decide whether Aquila began as a planned town or grew around a terminal. The green tint is an encyclopedia presentation treatment, not a world color specification.</desc>
  <defs>
    <filter id="encyclopedia-green" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="800" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="1.4 -0.45 -0.15 0 0
                                          -0.1 1 0.1 0 0
                                          0.05 0.65 0.05 0 0
                                          0 0 0 1 0"/>
    </filter>
    <radialGradient id="space" cx="12%" cy="12%" r="100%">
      <stop stop-color="#354957"/>
      <stop offset="0.48" stop-color="#152938"/>
      <stop offset="1" stop-color="#050d18"/>
    </radialGradient>
    <radialGradient id="saturn" cx="22%" cy="12%" r="96%">
      <stop stop-color="#d5c8a9"/>
      <stop offset="0.48" stop-color="#9da294"/>
      <stop offset="0.8" stop-color="#4a6269"/>
      <stop offset="1" stop-color="#1d3544"/>
    </radialGradient>
    <linearGradient id="alloy" x1="0" y1="0" x2="0.4" y2="1">
      <stop stop-color="#d2d5c3"/>
      <stop offset="0.32" stop-color="#83989b"/>
      <stop offset="0.7" stop-color="#3c5966"/>
      <stop offset="1" stop-color="#182d3e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.05" y1="0" x2="0.7" y2="1">
      <stop stop-color="#e0d8ba"/>
      <stop offset="0.35" stop-color="#a8b6af"/>
      <stop offset="0.7" stop-color="#587581"/>
      <stop offset="1" stop-color="#283f50"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#050d18" stop-opacity="0"/>
      <stop offset="1" stop-color="#050d18" stop-opacity="0.96"/>
    </linearGradient>
    <clipPath id="planet-clip"><circle cx="-110" cy="-120" r="510"/></clipPath>
    <pattern id="panel-grid" width="24" height="16" patternUnits="userSpaceOnUse">
      <rect width="24" height="16" fill="#1c3548"/>
      <path d="M0 0H24V16" fill="none" stroke="#54747f"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" seed="41" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
