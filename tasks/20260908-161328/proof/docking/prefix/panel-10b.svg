amily="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.3" fill="#376657">DANIEL / COMMS</text><text x="36" y="210" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#23333c">No. We have a recovery scheduled.</text></g><g data-balloon="2"><path d="M42 272H514Q538 272 538 296V304.85L600 324L538 326.85V317Q538 341 514 341H42Q18 341 18 317V296Q18 272 42 272Z" fill="#fff4dd" stroke="#23333c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="297" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.3" fill="#376657">ELENA / COMMS</text><text x="36" y="324" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#23333c">Your people won't last that long.</text></g><g data-balloon="3"><path d="M42 386H514Q538 386 538 410V418.85L602.5397172245266 438.5717161679344L538 440.85V431Q538 455 514 455H42Q18 455 18 431V410Q18 386 42 386Z" fill="#fff4dd" stroke="#23333c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="411" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.3" fill="#376657">DANIEL / COMMS</text><text x="36" y="438" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#23333c">I'm not approving the cost.</text></g></g></svg>