  <title id="title">Baikal: water-station exterior concept</title>
  <desc id="description">A small inhabited industrial station: storage vessels and processing modules occupy a utility spine, separated from a rotating residential section. Service panels and an unarmed workship complete the scene. Layout, equipment, capacity, scale and orbit are visual proposals, not established specifications. The green treatment does not establish physical colors.</desc>
