<svg xmlns="http://www.w3.org/2000/svg" width="800" height="840" viewBox="0 0 800 840" role="img" aria-labelledby="title description">
  <title id="title">From raw material to useful supply</title>
  <desc id="description">Earth supplies imported equipment and public finance. Local inputs include ice and recovered material. Local industry depends on collection, processing, power, equipment and transport to deliver useful supplies to homes, worksites and new construction. These are selected dependencies, not measured flows.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#173a29"/></pattern>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2L12 7L2 12" fill="none" stroke="#89bd99" stroke-width="2"/></marker>
  </defs>
  <rect width="800" height="840" fill="#08150d"/>
  <rect x="20" y="20" width="760" height="800" fill="url(#grid)" opacity="0.45"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="40" y="68" fill="#c5d9b9" font-size="30" font-weight="700">From ice to useful supply</text>
    <text x="40" y="101" fill="#87a68a" font-size="20">Abundance is only the beginning.</text>
    <rect x="40" y="146" width="342" height="155" rx="4" fill="#14281b" stroke="#688c70"/>
    <rect x="418" y="146" width="342" height="155" rx="4" fill="#14281b" stroke="#688c70"/>
    <text x="64" y="185" fill="#c5d9b9" font-size="26" font-weight="700">EARTH</text>
    <text x="64" y="228" fill="#afc4a9" font-size="22">Imports and equipment</text>
    <text x="64" y="266" fill="#afc4a9" font-size="22">Public investment</text>
    <text x="442" y="185" fill="#c5d9b9" font-size="26" font-weight="700">LOCAL INPUTS</text>
    <text x="442" y="228" fill="#afc4a9" font-size="22">Ice and other inputs</text>
    <text x="442" y="266" fill="#afc4a9" font-size="22">Recovered material</text>
    <g fill="none" stroke="#89bd99" stroke-width="3" marker-end="url(#arrow)">
      <path d="M210 310V359H331V393"/>
      <path d="M589 310V359H469V393"/>
    </g>
    <rect x="100" y="410" width="600" height="162" rx="4" fill="#283025" stroke="#b4a170" stroke-width="2"/>
    <text x="130" y="452" fill="#ddd8b3" font-size="28" font-weight="700">LOCAL INDUSTRY</text>
    <text x="130" y="495" fill="#c4c7ac" font-size="23">Collection, processing, maintenance</text>
    <text x="130" y="538" fill="#c4c7ac" font-size="23">Power, equipment, transport</text>
    <path d="M400 582V644" fill="none" stroke="#89bd99" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="100" y="662" width="600" height="108" rx="4" fill="#14281b" stroke="#688c70"/>
    <text x="130" y="704" fill="#c5d9b9" font-size="28" font-weight="700">USEFUL SUPPLIES</text>
    <text x="130" y="744" fill="#afc4a9" font-size="22">Homes, worksites, new construction</text>
    <text x="40" y="810" fill="#87a68a" font-size="18">Selected dependencies, not quantities or production rates.</text>
  </g>
</svg>
