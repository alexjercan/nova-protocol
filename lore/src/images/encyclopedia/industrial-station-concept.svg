<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Industrial station: visual concept</title>
  <desc id="description">An atmospheric illustration of a station with a rotating residential ring and an industrial spine, with small working ships nearby and Saturn behind it. The illustration proposes an appearance only. It does not establish an actual station, dimensions, an orbital position, or a ship design.</desc>
  <defs>
    <radialGradient id="space" cx="29%" cy="30%" r="80%">
      <stop stop-color="#18382e"/>
      <stop offset="0.5" stop-color="#071a15"/>
      <stop offset="1" stop-color="#020906"/>
    </radialGradient>
    <radialGradient id="planet" cx="26%" cy="24%" r="82%">
      <stop stop-color="#acc3a1"/>
      <stop offset="0.38" stop-color="#6d9076"/>
      <stop offset="0.72" stop-color="#294e3c"/>
      <stop offset="1" stop-color="#061b13"/>
    </radialGradient>
    <linearGradient id="ring-light" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#427056"/>
      <stop offset="0.28" stop-color="#afc6a0"/>
      <stop offset="0.62" stop-color="#78987a"/>
      <stop offset="1" stop-color="#1b3d2b"/>
    </linearGradient>
    <linearGradient id="hull-top" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#769582"/>
      <stop offset="0.38" stop-color="#3c6752"/>
      <stop offset="1" stop-color="#193929"/>
    </linearGradient>
    <linearGradient id="hull-side" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2a503b"/>
      <stop offset="1" stop-color="#071810"/>
    </linearGradient>
    <linearGradient id="habitat" x1="0" y1="0" x2="1" y2="0.7">
      <stop stop-color="#b4c4a8"/>
      <stop offset="0.25" stop-color="#74917a"/>
      <stop offset="0.56" stop-color="#2d503d"/>
      <stop offset="1" stop-color="#112a1b"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#75ffd0" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#75ffd0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d4ffdf"/>
    </linearGradient>
    <pattern id="stars" width="397" height="263" patternUnits="userSpaceOnUse">
      <circle cx="37" cy="43" r="1" fill="#c2ddbc"/>
      <circle cx="221" cy="19" r="0.7" fill="#9bbc9c"/>
      <circle cx="346" cy="128" r="1.1" fill="#adcab1"/>
