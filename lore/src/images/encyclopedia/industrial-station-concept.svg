      <path d="M5 5H13M29 20H33" stroke="#061a11" stroke-opacity="0.65"/>
    </pattern>
    <pattern id="panel-grid" width="19" height="25" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="16" height="22" fill="#10251c" stroke="#466651" stroke-width="0.6"/>
    </pattern>
    <pattern id="windows" width="18" height="12" patternUnits="userSpaceOnUse">
