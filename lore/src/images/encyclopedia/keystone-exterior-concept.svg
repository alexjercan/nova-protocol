      <stop offset="0.35" stop-color="#607077"/>
      <stop offset="0.62" stop-color="#a3a78f"/>
      <stop offset="1" stop-color="#d4c6a0"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#040a11" stop-opacity="0"/>
      <stop offset="1" stop-color="#040a11" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="planet-clip"><circle cx="1140" cy="122" r="312"/></clipPath>
    <pattern id="panel-grid" width="22" height="18" patternUnits="userSpaceOnUse">
