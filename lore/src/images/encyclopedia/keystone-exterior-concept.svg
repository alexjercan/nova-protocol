<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
  <title id="title">Keystone: exterior concept</title>
  <desc id="description">An atmospheric, original station proposal. A warm-windowed residential ring surrounds the near end of a long industrial spine. Service blocks, handling arms, cargo and an open construction frame extend toward Saturn. Small utility craft surround the station. Geometry, scale, ship designs and orbital position are not established canon. The green tint is an encyclopedia presentation treatment, not a world color specification.</desc>
  <defs>
    <filter id="encyclopedia-green" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="800" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="1.4 -0.45 -0.15 0 0
                                          -0.1 1 0.1 0 0
                                          0.05 0.65 0.05 0 0
                                          0 0 0 1 0"/>
    </filter>
    <radialGradient id="space" cx="80%" cy="16%" r="100%">
      <stop stop-color="#283542"/>
      <stop offset="0.52" stop-color="#101e2a"/>
      <stop offset="1" stop-color="#040a11"/>
    </radialGradient>
    <radialGradient id="saturn" cx="78%" cy="18%" r="92%">
      <stop stop-color="#c4b695"/>
      <stop offset="0.42" stop-color="#8a8776"/>
      <stop offset="0.76" stop-color="#404d54"/>
      <stop offset="1" stop-color="#172633"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#a0a797"/>
      <stop offset="0.35" stop-color="#65757a"/>
      <stop offset="0.68" stop-color="#34454f"/>
      <stop offset="1" stop-color="#101b26"/>
    </linearGradient>
    <linearGradient id="ring-metal" x1="0.15" y1="1" x2="0.85" y2="0">
