<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title description">
  <title id="title">EarthWorks Industrial: identity concept</title>
  <desc id="description">An original proposed identity, not established corporate branding. Two structural supports and a central keystone form an emblem above the EarthWorks Industrial name. The green palette is an encyclopedia presentation treatment, not established company colors.</desc>
  <defs>
    <filter id="encyclopedia-green" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="480" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="0.86" exponent="1.25" offset="0"/>
        <feFuncG type="linear" slope="0.96" intercept="0"/>
        <feFuncB type="gamma" amplitude="0.81" exponent="1.1" offset="0"/>
      </feComponentTransfer>
    </filter>
  </defs>

<g id="artwork" filter="url(#encyclopedia-green)">
  <rect width="800" height="480" fill="#171c1d"/>
  <rect x="16" y="16" width="768" height="448" fill="none" stroke="#3a4547"/>
  <text x="36" y="46" fill="#a8aaa4" font-family="DejaVu Sans Mono, monospace" font-size="17" letter-spacing="2">IDENTITY CONCEPT</text>
  <g fill="#de9457">
    <path d="M286 222V118L348 78V116L320 137V222Z"/>
    <path d="M452 78L514 118V222H480V137L452 116Z"/>
    <path d="M362 78H438L426 144H374Z"/>
    <path d="M286 222H514V242H286Z"/>
  </g>
  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <text x="400" y="342" fill="#ece6d9" font-size="68" font-weight="700" letter-spacing="-2">EarthWorks</text>
    <text x="405" y="392" fill="#c5c7bf" font-size="26" letter-spacing="10">INDUSTRIAL</text>
  </g>
  <path d="M170 430H630" fill="none" stroke="#de9457" stroke-width="4"/>
</g>
</svg>
