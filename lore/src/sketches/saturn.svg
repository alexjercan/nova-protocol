  <line x1="1100" y1="110" x2="680" y2="300" stroke="#267b4d" stroke-width="2" stroke-dasharray="8 10"/>
  <g transform="translate(640 300) rotate(0) scale(1 1)"><circle cx="0" cy="0" r="16" fill="none" stroke="#4ed184" stroke-width="3" filter="url(#glow)"/><path d="M-22,0 H22 M0,-22 V22" stroke="#4ed184" stroke-width="3"/><text x="28" y="6" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="19" font-weight="400" letter-spacing="2" text-anchor="start" fill="#4ed184">DATUM</text><text x="28" y="30" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="14" font-weight="400" letter-spacing="2" text-anchor="start" fill="#6ea985">SECTOR K. THE SHELTER'S ROCK. THE DESK</text></g>
