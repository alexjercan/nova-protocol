<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">

  <defs>
    <radialGradient id="screen" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#07190f"/><stop offset="1" stop-color="#030d08"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset=".55" stop-color="#030d08" stop-opacity="0"/><stop offset="1" stop-color="#030d08" stop-opacity=".7"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#001008" opacity=".5"/>
    </pattern>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#164c31" stroke-opacity=".28"/>
    </pattern>
    <radialGradient id="moon" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1e4431"/><stop offset=".55" stop-color="#0d2418"/><stop offset="1" stop-color="#040f09"/>
    </radialGradient>
    <radialGradient id="flash">
      <stop offset="0" stop-color="#e8fff0"/><stop offset=".18" stop-color="#c0ffd4"/><stop offset=".45" stop-color="#4ed184" stop-opacity=".85"/><stop offset="1" stop-color="#4ed184" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember">
      <stop offset="0" stop-color="#ffd67a"/><stop offset=".4" stop-color="#c2a23b" stop-opacity=".8"/><stop offset="1" stop-color="#c2a23b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#c2a23b" stop-opacity=".55"/><stop offset="1" stop-color="#c2a23b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenlight">
      <stop offset="0" stop-color="#4ed184" stop-opacity=".45"/><stop offset="1" stop-color="#4ed184" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  <linearGradient id="shade-r" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#020a06" stop-opacity=".9"/><stop offset=".55" stop-color="#020a06" stop-opacity=".55"/><stop offset="1" stop-color="#020a06" stop-opacity="0"/></linearGradient>
  <linearGradient id="shade-l" x1="1" x2="0" y1="0" y2="0"><stop offset="0" stop-color="#020a06" stop-opacity=".9"/><stop offset=".55" stop-color="#020a06" stop-opacity=".55"/><stop offset="1" stop-color="#020a06" stop-opacity="0"/></linearGradient>
</defs>
  <rect width="1200" height="800" fill="#030d08"/>
  <rect width="1200" height="800" fill="url(#screen)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <circle cx="990" cy="230" r="120" fill="url(#moon)" stroke="#7b8f8a" stroke-width="3" opacity=".9"/>
  <ellipse cx="990" cy="230" rx="122" ry="40" fill="none" stroke="#7b8f8a" stroke-width="1" opacity=".5"/>
  <text x="990" y="390" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="18" font-weight="400" letter-spacing="5" text-anchor="middle" fill="#7b8f8a">EARTH</text>
  <text x="990" y="416" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13" font-weight="400" letter-spacing="2" text-anchor="middle" fill="#6ea985">70 TO 90 LIGHT-MINUTES</text>
  <rect x="54" y="94" width="772" height="632" rx="14" fill="#3a3f2c" stroke="#8f8656" stroke-width="5"/><rect x="80" y="120" width="720" height="580" fill="#04120b" stroke="#267b4d" stroke-width="3"/><line x1="80" y1="180" x2="800" y2="180" stroke="#164c31" stroke-opacity=".5"/><line x1="80" y1="240" x2="800" y2="240" stroke="#164c31" stroke-opacity=".5"/><line x1="80" y1="300" x2="800" y2="300" stroke="#164c31" stroke-opacity=".5"/><line x1="80" y1="360" x2="800" y2="360" stroke="#164c31" stroke-opacity=".5"/><line x1="80" y1="420" x2="800" y2="420" stroke="#164c31" stroke-opacity=".5"/><line x1="80" y1="480" x2="800" y2="480" stroke="#164c31" stroke-opacity=".5"/><line x1="80" y1="540" x2="800" y2="540" stroke="#164c31" stroke-opacity=".5"/><line x1="80" y1="600" x2="800" y2="600" stroke="#164c31" stroke-opacity=".5"/><line x1="80" y1="660" x2="800" y2="660" stroke="#164c31" stroke-opacity=".5"/><line x1="140" y1="120" x2="140" y2="700" stroke="#164c31" stroke-opacity=".5"/><line x1="200" y1="120" x2="200" y2="700" stroke="#164c31" stroke-opacity=".5"/><line x1="260" y1="120" x2="260" y2="700" stroke="#164c31" stroke-opacity=".5"/><line x1="320" y1="120" x2="320" y2="700" stroke="#164c31" stroke-opacity=".5"/><line x1="380" y1="120" x2="380" y2="700" stroke="#164c31" stroke-opacity=".5"/><line x1="440" y1="120" x2="440" y2="700" stroke="#164c31" stroke-opacity=".5"/><line x1="500" y1="120" x2="500" y2="700" stroke="#164c31" stroke-opacity=".5"/><line x1="560" y1="120" x2="560" y2="700" stroke="#164c31" stroke-opacity=".5"/><line x1="620" y1="120" x2="620" y2="700" stroke="#164c31" stroke-opacity=".5"/><line x1="680" y1="120" x2="680" y2="700" stroke="#164c31" stroke-opacity=".5"/><line x1="740" y1="120" x2="740" y2="700" stroke="#164c31" stroke-opacity=".5"/><rect x="80" y="120" width="720" height="34" fill="#183426" opacity=".9"/><text x="96" y="144" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="19" font-weight="400" letter-spacing="3" text-anchor="start" fill="#c0ffd4">EWI BOARD // EARTH DESK // TO SATURN DESK</text><rect x="770" y="132" width="14" height="10" fill="#4ed184"/><rect x="746" y="132" width="14" height="10" fill="#b8da5d"/><rect x="722" y="132" width="14" height="10" fill="#4ed184"/><rect x="698" y="132" width="14" height="10" fill="#c2a23b"/>
  <text x="120" y="210" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="21" font-weight="400" letter-spacing="2" text-anchor="start" fill="#c0ffd4">RE: SITE CONSOLIDATION, RING SECTOR K</text><text x="120" y="252" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="21" font-weight="400" letter-spacing="2" text-anchor="start" fill="#4ed184"></text><text x="120" y="294" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="21" font-weight="400" letter-spacing="2" text-anchor="start" fill="#c0ffd4">APPROVED.</text><text x="120" y="336" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="21" font-weight="400" letter-spacing="2" text-anchor="start" fill="#4ed184">MEANS AT REGIONAL DISCRETION.</text><text x="120" y="378" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="21" font-weight="400" letter-spacing="2" text-anchor="start" fill="#4ed184">COSTS AGAINST REGIONAL TERM.</text><text x="120" y="420" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="21" font-weight="400" letter-spacing="2" text-anchor="start" fill="#4ed184">NO WITNESSES AT WORKING LEVEL.</text><text x="120" y="462" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="21" font-weight="400" letter-spacing="2" text-anchor="start" fill="#4ed184"></text><text x="120" y="504" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="21" font-weight="400" letter-spacing="2" text-anchor="start" fill="#c2a23b">ACKNOWLEDGE BY VOICE.</text><text x="120" y="546" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="21" font-weight="400" letter-spacing="2" text-anchor="start" fill="#4ed184"></text><text x="120" y="588" font-family="IBM Plex Mono, DejaVu Sans Mono, Menlo, monospace" font-size="21" font-weight="400" letter-spacing="2" text-anchor="start" fill="#6ea985">THIS DESK DOES NOT SPEAK.</text>
  <rect width="1200" height="800" fill="url(#scan)"/>
  <rect width="1200" height="800" fill="url(#vignette)"/>
</svg>
