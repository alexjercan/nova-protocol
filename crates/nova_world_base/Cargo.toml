[package]
name = "nova_world_base"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
description = "The base game's open world: its sector generator and the session that streams it"

[dependencies]
bevy = { version = "0.19.0" }
# `LoadedSectionPacks`: the section packs and catalog digest the content merge
# registered, which the open world pins its ship parts to when it arms.
nova_assets = { path = "../nova_assets" }
# The environment: three global `Fbm<Perlin>` fields every cluster and
# background scatter reads. Same crate and version the planet and asteroid
# surfaces already generate from, so a world field and a shipped surface
# cannot drift onto two noise implementations.
noise = { version = "0.9" }
# `Meters` and `Meters3`: the generator authors every quantity in meters.
nova_events = { path = "../nova_events" }
# `Fnv32` and `SeedStream`, the stable hash and the deterministic draw every
# sector choice comes from, the player ship marker the world streams around,
# and the default `GravitySettings` a planetoid's mass is derived under.
nova_gameplay = { path = "../nova_gameplay" }
# The planet and asteroid tables the generator draws from, and the live
# scenario whose role arms the world.
nova_scenario = { path = "../nova_scenario" }
# The section prototypes a ship-part snapshot validates, and the one
# cell-grid fit it shares with the WFC. `serde` for the canonical RON form the
# snapshot hash reads.
nova_ship = { path = "../nova_ship", features = ["serde"] }
ron = { version = "0.12" }
# The mechanism: `SectorGenerator`, `WorldConfig`, `NovaWorldPlugin`.
nova_world = { path = "../nova_world" }

[lints]
workspace = true

[features]
# Debug-build extras, fanned out so the whole tree resolves ONE bevy variant.
debug = ["bevy/track_location", "nova_world/debug", "nova_scenario/debug"]
