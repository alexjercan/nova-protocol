[package]
name = "nova_editor"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
description = "Spaceship editor scene for the Nova Protocol game"

[dependencies]
avian3d = { version = "0.7" }
# `reflect_documentation` carries every reflected field's and variant's own
# doc comment into the type registry. The inspector reads them as its
# tooltips, so the panel explains a field from the same sentence the config
# author wrote beside it - a second list of hints kept here would be one
# more thing to keep true.
bevy = { version = "0.19.0", features = ["reflect_documentation"] }
bevy_enhanced_input = { version = "0.26.0" }
rand = { version = "0.10.2" }
nova_input = { path = "../nova_input" }
nova_assets = { path = "../nova_assets" }
nova_gameplay = { path = "../nova_gameplay" }
# The save file IS the mod format: `Content`, its RON writer and its reader.
nova_modding = { path = "../nova_modding" }
nova_ship = { path = "../nova_ship" }
nova_scenario = { path = "../nova_scenario" }
nova_ui = { path = "../nova_ui" }
# The world scale the inspector converts through, and the engine half of the
# objective-set proof: real handlers, driven with the same events the game fires.
nova_events = { path = "../nova_events" }

[lints]
workspace = true

[features]
debug = ["bevy/track_location", "nova_gameplay/debug"]
