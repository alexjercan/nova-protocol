[package]
name = "nova_hud"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
description = "The player's heads-up display: the diegetic instruments and overlays drawn for the player ship"

[dependencies]
avian3d = { version = "0.7" }
bevy = { version = "0.19.0" }
nova_input = { path = "../nova_input" }
nova_gameplay = { path = "../nova_gameplay" }
nova_ship = { path = "../nova_ship" }
nova_ui = { path = "../nova_ui" }

[dev-dependencies]
# The headless avian app the bore-sight test builds on. The sight is a
# SpatialQuery consumer, so proving it marks the right sections needs a real
# broadphase rather than a hand-placed hit list.
nova_gameplay = { path = "../nova_gameplay", features = ["test-support"] }

[lints]
workspace = true

[features]
debug = ["bevy/track_location", "nova_gameplay/debug"]
