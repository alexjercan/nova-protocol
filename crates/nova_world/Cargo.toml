[package]
name = "nova_world"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
description = "Deterministic sector generation and streaming for the Nova Protocol open world"

[dependencies]
# `LinearVelocity` and `AngularVelocity`: a frozen body keeps the motion it
# left the window with.
avian3d = { version = "0.7.0" }
# Components, resources, system sets and `AsyncComputeTaskPool`. This crate
# owns systems, so it builds a plugin; `nova_world_base` adds it for the game.
bevy = { version = "0.19.0" }
# `ASTEROID_TEXTURE_PATH`: the texture a materialized sector hands its rocks.
nova_assets = { path = "../nova_assets" }
# `Meters` and `Meters3`: every world quantity here is authored in meters and
# converted at the engine edge.
nova_events = { path = "../nova_events" }
# `Fnv32` and `SeedStream`: the stable hash and the deterministic draw a
# coordinate-addressable world is built on. Never the ambient RNG.
nova_gameplay = { path = "../nova_gameplay" }
# The object factories a streamed sector spawns through - the same ones the
# scenario loader calls - plus `PlanetType`, the ship design resolver, the
# asteroid kind table and the session liveness the outer cleanup is gated on.
nova_scenario = { path = "../nova_scenario" }
# `GameSections`: the loaded section catalog a generated ship's inline design
# is resolved against before its sector spawns.
nova_ship = { path = "../nova_ship" }
# The frozen ledger is the body of a saved world. `rc` because each cell's
# record is shared with the save that is writing it.
serde = { version = "1", features = ["derive", "rc"], optional = true }

[dev-dependencies]
# The saved-world round trip: a ledger written and read back is the same.
ron = { version = "0.12" }
# The headless avian app a docked pair needs, to prove a sector retirement
# never takes a ship the player is docked to.
nova_gameplay = { path = "../nova_gameplay", features = ["test-support"] }

[lints]
workspace = true

[features]
# Debug-build extras, fanned out so the whole tree resolves ONE bevy variant.
debug = ["bevy/track_location", "nova_scenario/debug"]
# The RON form of the frozen ledger and the sector coordinate, for a saved
# world. Web builds save nothing and leave it off.
serde = ["dep:serde", "nova_gameplay/serde", "nova_scenario/serde", "nova_ship/serde"]
