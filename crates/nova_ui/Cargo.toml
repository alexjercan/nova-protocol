[package]
name = "nova_ui"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
description = "Shared UI theme and widgets for the Nova Protocol game"

[dependencies]
bevy = { version = "0.19.0" }
# The physical quantity types the formatter takes. `nova_events` is the deepest
# crate both the display side and the physics side can reach, so a readout and
# a hull measure a meter the same way.
nova_events = { path = "../nova_events" }
# The UI-THEME format (`theme::config`) is serde unconditionally: it is mod
# content, so every consumer of this crate reaches a crate that must parse it.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The theme tests decode an AUTHORED theme file rather than a builder, because
# what a mod ships is RON text and `deny_unknown_fields` is part of the format.
ron = { version = "0.12" }

[lints]
workspace = true

