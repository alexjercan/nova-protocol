[package]
name = "nova_ui"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
description = "Shared UI theme and widgets for the Nova Protocol game"

[dependencies]
bevy = { version = "0.19.0" }
# The physical quantity types the formatter takes. `nova_events` is the deepest
# crate both the display side and the physics side can reach, so a readout and
# a hull measure a meter the same way.
nova_events = { path = "../nova_events" }
# `serde` enables Serialize/Deserialize on `UiSkin` so it can persist through the
# settings store, mirroring nova_gameplay's setting resources. Optional: the
# widget layer itself needs no serialization.
serde = { version = "1", features = ["derive"], optional = true }

[lints]
workspace = true

[features]
serde = ["dep:serde"]
