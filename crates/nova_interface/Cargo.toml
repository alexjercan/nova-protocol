[package]
name = "nova_interface"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
description = "The NOVA OS cockpit monitor: the CRT terminal shell and its map/ship apps"

[dependencies]
avian3d = { version = "0.7" }
bevy = { version = "0.19.0" }
bevy_enhanced_input = { version = "0.26.0" }
nova_input = { path = "../nova_input" }
nova_gameplay = { path = "../nova_gameplay" }
nova_ship = { path = "../nova_ship" }
nova_hud = { path = "../nova_hud" }
nova_events = { path = "../nova_events" }
nova_command = { path = "../nova_command" }
nova_ui = { path = "../nova_ui" }

[dev-dependencies]
ron = { version = "0.12" }
serde = { version = "1", features = ["derive"] }
# The docked generated-wreck test: the real physics app, the scenario ship
# spawn and catalog parsing, and the world's own wreck generation and
# materialization.
nova_gameplay = { path = "../nova_gameplay", features = ["test-support"] }
nova_scenario = { path = "../nova_scenario", features = ["serde"] }
nova_world = { path = "../nova_world" }
nova_world_base = { path = "../nova_world_base" }

[lints]
workspace = true

[features]
debug = ["bevy/track_location", "nova_gameplay/debug", "nova_hud/debug"]
