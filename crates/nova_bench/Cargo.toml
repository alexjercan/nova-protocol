[package]
name = "nova_bench"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
description = "The agent bench: a referee that lets an external agent play a scenario over the process channel, and scores the run (dev tools)"

# No `nova_*` dependency on purpose. The bench speaks JSON to the game over
# pipes and to the agent over a socket, so its tests link neither Bevy nor
# the game - the same rule nova_autopilot keeps. The game binary is spawned
# by path (`current_exe`), never linked.

[dependencies]
# Same derive-based CLI the game binary and the probe host use.
clap = { version = "4.5.48", features = ["derive"] }
# The audit stream and the score are serialized by derive; the snapshot and
# the wire lines are read as plain values.
serde = { version = "1", features = ["derive"] }
# `preserve_order`: the referee BUILDS its observation header in reading order -
# the clock, then what is left, then the world - and a default `serde_json::Map`
# is a BTreeMap that sorts that away, landing `bodies` ahead of `budget_left` in
# the one text the agent reads every turn. The feature is additive across the
# graph, so it reaches every serde_json user in a `debug` build; key order is
# presentational in all of them (reports and the wire are parsed, never
# compared as text).
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
