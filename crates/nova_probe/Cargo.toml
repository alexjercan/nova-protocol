[package]
name = "nova_probe"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
description = "In-game evidence collection for the Nova Protocol run-probe: frame-time capture, run timeline, invariant checks and the wire format the host harness reads (dev tools)"

[lib]
path = "src/lib.rs"

[features]
# The Bevy variant the child runs are built with: the game's `debug` feature
# flips `bevy/track_location`, and a host harness resolved without it would
# compile a SECOND Bevy into the same target dir. Fans out through
# nova_gameplay like every other crate's `debug`.
debug = ["nova_gameplay/debug"]

[dependencies]
# The invariant checks read avian's LinearVelocity directly (same pinned
# version the whole workspace resolves).
avian3d = { version = "0.7" }
bevy = { version = "0.19.0" }
# The completion protocol the capture collector negotiates its exit through -
# named directly, not reached through nova_gameplay: the direction is
# probe -> autopilot, never the reverse.
nova_autopilot = { path = "../nova_autopilot" }
# The shared scenario fixtures build a game app's config, so they name the
# assembly crate. NOT the root `nova-protocol` package: nothing under crates/
# depends on the game binary.
nova_core = { path = "../nova_core" }
# The capture plugin reads GameStates / WeaponsHot / PlayerSpaceshipMarker and
# tops up Health (nova's own, out of nova_gameplay::integrity::health).
nova_gameplay = { path = "../nova_gameplay" }
nova_ship = { path = "../nova_ship" }
# The run-timeline recorder observes the scenario's GameEvent stream, named
# directly out of the engine that owns it rather than re-exported through
# nova_gameplay - the same probe -> dependency direction as nova_autopilot.
nova_events = { path = "../nova_events" }
# ... and snapshot-diffs NovaEventWorld's variables.
nova_scenario = { path = "../nova_scenario" }
# The snapshot's `ui` block reads the terminal model (NovaOsTerminal, via
# nova_os_ui's re-export) and the CRT glass slice (map contact codes pushed
# through the shipped warp inverse) - the screen a GUI player sees, as data.
nova_os_ui = { path = "../nova_os_ui" }
# Timeline entries carry the events' serde_json payloads (GameEventInfo::data),
# so the JSONL sink serializes with serde_json rather than hand-rolling.
serde_json = { version = "1" }
# Wasm-only: the harness reads its config from the URL query string in the
# browser (no process env there).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }

[lints]
workspace = true
