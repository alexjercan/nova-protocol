[package]
name = "nova_probe"
# `cargo run -p nova_probe -- ...` is the harness front door (the probe bin);
# the other bins stay directly addressable via --bin.
default-run = "probe"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
description = "Run-harness for the Nova Protocol game: frame-time capture and perf reporting over autopilot runs (dev tools)"

[lib]
path = "src/lib.rs"

# The web/native frame-time capture binary. Lives here (not in the root package)
# so the root has a single bin and `cargo run` needs no `--bin`. Trunk builds it
# for wasm via perf.html; it runs natively too.
[[bin]]
name = "perf_web"
path = "src/bin/perf_web.rs"




# The front door: `probe run <example>` orchestrates the passes and the
# report; sweep/web/profile wrap the perf scripts.
[[bin]]
name = "probe"
path = "src/bin/probe/main.rs"

[dependencies]
# The invariant checks read avian's LinearVelocity directly (same pinned
# version the whole workspace resolves).
avian3d = { version = "0.7" }
bevy = { version = "0.19.0" }
# The completion protocol the capture collector negotiates its exit through -
# named directly, not reached through nova_gameplay: the direction is
# probe -> autopilot, never the reverse.
nova_autopilot = { path = "../nova_autopilot" }
# The capture plugin reads GameStates / WeaponsHot / PlayerSpaceshipMarker and
# tops up Health (nova's own, out of nova_gameplay::integrity::health).
nova_gameplay = { path = "../nova_gameplay" }
# The run-timeline recorder observes the scenario's GameEvent stream, named
# directly out of the engine that owns it rather than re-exported through
# nova_gameplay - the same probe -> dependency direction as nova_autopilot.
nova_events = { path = "../nova_events" }
# ... and snapshot-diffs NovaEventWorld's variables.
nova_scenario = { path = "../nova_scenario" }
# Timeline entries carry the events' serde_json payloads (GameEventInfo::data),
# so the JSONL sink serializes with serde_json rather than hand-rolling.
serde_json = { version = "1" }
# The `perf_web` bin builds the real game app; it needs the full stack, but not
# the debug overlays (the harness is not debug-gated now that it lives here).
nova-protocol = { path = "../.." }

# Wasm-only: the harness reads its config from the URL query string in the
# browser (no process env there).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }

# The profile-sandbox rig re-executes this test binary as a CHILD and has it
# call the very stores a spawned run would read (`tests/profile_sandbox.rs`):
# nova_assets for the mod cache + enabled-mods prefs, `dirs` for the data/config
# dirs those stores (and nova_menu's private settings_store) resolve through.
[dev-dependencies]
dirs = "6"
nova_assets = { path = "../nova_assets" }
tempfile = "3"

[lints]
workspace = true
