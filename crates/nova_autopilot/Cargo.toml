[package]
name = "nova_autopilot"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
description = "Scripted automation drivers and the run-completion protocol"

[dependencies]
bevy = { version = "0.19.0" }

[dev-dependencies]
# Captures the watcher's deadline log so the test can assert it NAMES the
# laggards, not just that the exit was an error.
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[lints]
workspace = true
