[package]
name = "nova_console"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false
description = "The Command shell's dispatcher: the executor behind the CRT prompt and the process channel"

[dependencies]
bevy = { version = "0.19.0" }
nova_events = { path = "../nova_events" }
nova_gameplay = { path = "../nova_gameplay" }
nova_input = { path = "../nova_input" }
nova_menu = { path = "../nova_menu" }
nova_command = { path = "../nova_command" }
nova_interface = { path = "../nova_interface" }
nova_scenario = { path = "../nova_scenario" }
nova_ship = { path = "../nova_ship" }

[dev-dependencies]
nova_gameplay = { path = "../nova_gameplay", features = ["test-support"] }

[lints]
workspace = true

[features]
debug = [
  "bevy/track_location",
  "nova_gameplay/debug",
  "nova_menu/debug",
  "nova_interface/debug",
  "nova_scenario/debug",
]
