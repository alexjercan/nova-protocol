[package]
name = "nova_events_macros"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Procedural macros for the Nova Protocol event engine"
# First-party: distributed as part of nova_events, never published.
# `publish = false` keeps it out of cargo-about's third-party license manifest.
publish = false

[lib]
proc-macro = true

[dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }
proc-macro2 = "1"

[lints]
workspace = true
