# Scufris reads this file as a menu, not a workflow. Conventions are inferred
# when the request is silent. Agents run only when the request names them.

[conventions]
keywords = { tracking = "tatr", when = "on-request", evidence = "tasks/", workspace = "sprout", base = "master", toolchain = "nix develop", rust = "cargo", landing = "explicit", attribution = "none" }
guidance = """
Use Tatr only when the request asks for tracked work. Keep one task for one
request and its follow-up work, and keep proof-bearing decisions, notes and
verification evidence with the task. Keep the main checkout on master,
preserve unrelated user changes, and do project work in a Sprout worktree.
Run only affected checks unless the request asks for broader verification.
Inspect rendered reports and generated output rather than trusting exit status
alone. Commit self-contained changes with explicit paths and no AI
attribution. Never push, tag, publish or cut a release without an explicit
request.
"""

[agents.work]
description = "Implement a change in the project."
keywords = { harness = "claude", model = "Opus", thinking = "xhigh" }
guidance = """
Follow AGENTS.md and the project's existing architecture and conventions. Keep
scope focused, inspect local sources first, and prefer the cheapest proof that
establishes the change.
"""

[agents.review]
description = "Read finished work independently and report findings."
keywords = { harness = "claude", model = "Opus", thinking = "xhigh", spawn = "review_of", command = "/nova-review" }
guidance = """
Run `/nova-review` over the range the work produced. It is this project's own
review panel: it dispatches the reviewer lanes and adjudicates what they
report, read-only against the implementation job's exact workspace. Report
correctness, coverage, regression, maintainability, documentation and proof
findings with paths and lines. Keep one review job for the work: spawn it for
the first round, then steer that same job with scufris_job_send for each later
round, because a fresh reviewer has no record of what it already accepted.
Spawn a second review job only when no owned review job covers this work.
Repeat the implement-then-review cycle only for as long as the request asked
for.
"""

[agents.research]
description = "Search, compare references, and build reports or visual studies."
keywords = { harness = "claude", model = "Fable", thinking = "xhigh", sources = "local-first" }
guidance = """
Use this agent for research and creative exploration: searching for assets,
comparing references, building reports, designing HTML artifacts, making
visual studies, and creating disposable proofs of concept. Inspect project
sources before external research. Keep factual claims sourced, label taste and
speculation, and preserve useful artifacts with the owning task or at the
requested destination. Hand settled implementation requirements to the work
agent rather than building them here.
"""

[agents.quick-review]
description = "Open the Quick Review walkthrough page for the user to approve."
keywords = { tool = "scufris_job_quick_review", harness = "pi", mode = "rpc", model = "openai-codex/gpt-5.6-sol", thinking = "medium", extension = "npm:@alexjercan/quick-review@0.1.1" }
guidance = """
Start the standalone Quick Review extension in its separate Pi RPC agent. Keep
foreground Scufris responsive while that agent writes the walkthrough and
answers page questions. Do not use these Pi RPC settings for the review agent.
"""

[briefings.morning]
description = "Report CI on master and where the project stands this morning."
keywords = { harness = "claude", model = "Opus", thinking = "medium" }
guidance = """
Read the checkout and the last CI runs. Do not build, do not run the test
suites, and change nothing.

- `gh run list --branch master --limit 8 --json
  name,conclusion,status,createdAt,url` for CI. Name a failing or cancelled
  workflow and give its link. A run still going is worth a line only when it
  has been going a long time.
- `git status --short` for work left uncommitted overnight, and
  `git log --oneline -12` for what landed yesterday.
- `tatr ls -f '(:status eq OPEN)' -s priority` for open tasks. Report the count
  and the two or three at the top, never the list.
- The Unreleased section of `CHANGELOG.md`, for whether there is a release
  worth cutting.

Facts are counts: failing workflows, uncommitted files, open tasks, Unreleased
entries.

A green master with a clean tree is a good morning. Say so with `status = "ok"`
and a short body rather than finding something to say. This is a report on the
repository only. Storefront numbers from itch.io or Steam are not part of it
yet, so do not go looking for them.
"""
