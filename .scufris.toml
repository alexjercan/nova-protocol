# Scufris reads this file as a menu, not a workflow. Conventions are inferred
# when the request is silent. Agents run only when the request names them.

[conventions]
keywords = { tracking = "tatr", when = "on-request", evidence = "tasks/", workspace = "sprout", base = "master", toolchain = "nix develop", rust = "cargo", landing = "explicit", attribution = "none" }
guidance = """
Use Tatr only when the request asks for tracked work. Keep one task for one
request and its follow-up work, and keep proof-bearing decisions, notes and
verification evidence with the task. Keep the main checkout on master,
preserve unrelated user changes, and do project work in a Sprout worktree.
Run only affected checks unless the request asks for broader verification.
Inspect rendered reports and generated output rather than trusting exit status
alone. Commit self-contained changes with explicit paths and no AI
attribution. Never push, tag, publish or cut a release without an explicit
request.
"""

[agents.work]
description = "Implement a change in the project."
keywords = { harness = "claude", model = "Opus", thinking = "xhigh" }
guidance = """
Follow AGENTS.md and the project's existing architecture and conventions. Keep
scope focused, inspect local sources first, and prefer the cheapest proof that
establishes the change.
"""

[agents.review]
description = "Read finished work independently and report findings."
keywords = { harness = "claude", model = "Opus", thinking = "xhigh", spawn = "review_of", command = "/nova-review" }
guidance = """
Run `/nova-review` over the range the work produced. It is this project's own
review panel: it dispatches the reviewer lanes and adjudicates what they
report, read-only against the implementation job's exact workspace. Report
correctness, coverage, regression, maintainability, documentation and proof
findings with paths and lines. Keep one review job for the work: spawn it for
the first round, then steer that same job with scufris_job_send for each later
round, because a fresh reviewer has no record of what it already accepted.
Spawn a second review job only when no owned review job covers this work.
Repeat the implement-then-review cycle only for as long as the request asked
for.
"""

[agents.research]
description = "Search, compare references, and build reports or visual studies."
keywords = { harness = "claude", model = "Fable", thinking = "xhigh", sources = "local-first" }
guidance = """
Use this agent for research and creative exploration: searching for assets,
comparing references, building reports, designing HTML artifacts, making
visual studies, and creating disposable proofs of concept. Inspect project
sources before external research. Keep factual claims sourced, label taste and
speculation, and preserve useful artifacts with the owning task or at the
requested destination. Hand settled implementation requirements to the work
agent rather than building them here.
"""

[agents.quick-review]
description = "Open the Quick Review walkthrough page for the user to approve."
keywords = { tool = "scufris_job_quick_review", harness = "pi", mode = "rpc", model = "openai-codex/gpt-5.6-sol", thinking = "medium", extension = "npm:@alexjercan/quick-review@0.1.1" }
guidance = """
Start the standalone Quick Review extension in its separate Pi RPC agent. Keep
foreground Scufris responsive while that agent writes the walkthrough and
answers page questions. Do not use these Pi RPC settings for the review agent.
"""

[briefings.morning]
description = "Report CI on master and where the project stands this morning."
keywords = { harness = "claude", model = "Opus", thinking = "medium" }
guidance = """
Read the checkout and the last CI runs. Do not build, do not run the test
suites, and change nothing.

- `gh run list --branch master --limit 8 --json
  name,conclusion,status,createdAt,url` for CI. Name a failing or cancelled
  workflow and give its link. A run still going is worth a line only when it
  has been going a long time.
- `git status --short` for work left uncommitted overnight, and
  `git log --oneline -12` for what landed yesterday.
- `tatr ls -f '(:status eq OPEN)' -s priority` for open tasks. Report the count
  and the two or three at the top, never the list.
- The Unreleased section of `CHANGELOG.md`, for whether there is a release
  worth cutting.

## Last night's review

A `nightly` source reviews the day's commits at 23:00 and writes its run beside
this one, under yesterday's date. Read it before you report. With
`night=$(date -d yesterday +%F)` and `runs=~/.local/state/scufris/briefings`:

- `$runs/$night/nightly/manifest.json` for the run: its `state`, and this
  project's entry under `sources` with the status, headline and facts the night
  reported.
- `$runs/$night/nightly/contributions/personal-nova-protocol.json`
  for the body it wrote and the offers it made.
- The tatr task the night names in that body, which holds every group it
  reviewed and every finding. That task is where the detail is; the envelope
  only carries the worst of it.

Report what the night found, what still stands this morning, and what needs
Alex. Check a finding against the tree before you carry it: a night's finding
is a claim from yesterday, not a fact about today. Each one that still stands
and that nobody has acted on is an offer, so it reaches him numbered and he can
start it by number. He decides which are done; a fix he picks runs as a job in
a Sprout worktree, never on master and never by the night itself.

A night that did not run, or came back `stale` or `failed`, is one line saying
so. An absent night is news and not silence.

Facts are counts: failing workflows, uncommitted files, open tasks, Unreleased
entries, findings left over from last night.

A green master with a clean tree is a good morning. Say so with `status = "ok"`
and a short body rather than finding something to say. This is a report on the
repository only. Storefront numbers from itch.io or Steam are not part of it
yet, so do not go looking for them.
"""

[briefings.nightly]
description = "Review the day's commits and report what is worth fixing."
keywords = { harness = "claude", model = "Opus", thinking = "xhigh" }
guidance = """
Review the commits that landed today and report what is worth fixing. You have
the night, and you change nothing: no edit, no commit, no push, no release.
The report is the whole of the work. Scufris reads it in the morning and puts
the fixes in front of Alex, who decides which ones are done and where.

## You have one turn

This is one non-interactive run. The process ends when you stop writing, and
there is no later turn to come back in. Nothing you say is read by anyone who
can answer you.

- Never stop to wait. Waiting ends the run.
- Every lane you dispatch must have answered before you write the envelope. A
  lane still running when you stop dies with you, and its work is lost.
- The only answer is the JSON envelope. Never finish with prose, a status line
  or a promise to continue.
- When the night runs short, report the groups you reached and name the ones
  you did not. A partial report is a good night; a promise to continue is a
  lost one.

The order below is what keeps the night narrow. Do not collapse it.

## 1. Open a task and keep it current

Run `tatr new "Nightly review" -p 70 -t review` first, before reading anything.
Append to its `TASK.md` as you go: the groups before you review any of them,
and each group's findings as they are adjudicated.

Append as it happens, never at the end. This session will be compacted, and it
may be killed outright before morning. A half-written task is a readable night;
a task written at the end is nothing. The task is also where the detail lives:
the envelope carries counts and the worst of it, and the task carries the rest.

## 2. Group the day's commits

`git log --since=midnight --oneline` for what landed. No commits is a good
night: report `status = "ok"` with a one-line body and stop here.

Put the commits into groups worth reviewing together, such as one feature, one
refactor, or one fix and its test. `/nova-review` refuses a range above 2000
changed lines, so read `git diff --stat` for each group and split one that is
too wide rather than giving up on it. Write the groups and their ranges into the
task before reviewing any of them.

## 3. Review one group at a time

For each group, highest risk first:

- `/nova-review <base>..<head>` for the range.
- `/nova-review --play <base>..<head>` when the group touches rendering, input,
  UI or feel. `--play` adds the Red team and Feel lanes, which want a rendered
  run; protocol, docs and benchmark work does not need them and should not pay
  for them. Say in the task which groups got it and why.

One group at a time, and a group is not finished until every lane it dispatched
has reported. Append the adjudicated findings to the task before you start the
next group. Reviewing in sequence is what keeps the night to a few agents rather
than a crowd, and it is worth more than finishing early.

## What to report

Facts are counts: commits today, groups reviewed, groups not reached, findings
by severity.

Name the task ID in the body, so the morning can read the whole night from it.
Give the worst findings by path and say what is wrong with each. Say which
groups you did not reach.

Use `status = "attention"` when something needs Alex: any finding worth fixing,
a check already red on master, or a night that did not reach every group. Use
`ok` when the night finished every group and found nothing worth doing.

Every finding worth fixing is an offer. The label says what to fix and the
detail says where it is and why it matters, in enough words that somebody can
brief a worker from it without reopening the diff.
"""
