[preferences.tracking]
keywords = { tool = "tatr", when = "on-request", evidence = "tasks/" }
guidance = """
Use Tatr only when the user requests tracked work. Keep one task for one request
and its follow-up work. Keep proof-bearing decisions, notes, review, and
verification evidence with the task.
"""

[preferences.workspace]
keywords = { workspace = "sprout", base = "master" }
guidance = """
Use a Sprout workspace for project implementation. Keep the main checkout on
master, preserve unrelated user changes, and land the completed Sprout
explicitly after review and approval.
"""

[preferences.implementation]
keywords = { harness = "claude", model = "Opus", thinking = "xhigh" }
guidance = """
Follow AGENTS.md and the project's existing architecture and conventions. Keep
scope focused, inspect local sources first, and prefer the cheapest proof that
establishes the change.
"""

[preferences.review]
keywords = { review = "independent-then-quick-review", harness = "claude", model = "Opus", thinking = "xhigh" }
guidance = """
Run an independent read-only reviewer against the implementation workspace.
Review correctness, requirement coverage, regressions, maintainability,
documentation, and proof quality. Return findings to the coding agent and
verify corrections, then open Quick Review for user approval before delivery.
"""

[preferences.research]
keywords = { harness = "claude", model = "Fable", thinking = "xhigh", sources = "local-first" }
guidance = """
Prefer this harness for research and creative exploration: searching for assets,
comparing references, building reports, designing HTML artifacts, making visual
studies, and creating disposable proofs of concept. Inspect project sources
before external research. Keep factual claims sourced, label taste and
speculation, preserve useful artifacts with the owning task or at the
user-requested destination, and hand settled implementation requirements to the
coding agent.
"""

[preferences.verification]
keywords = { verification = "focused", toolchain = "nix develop", rust = "cargo" }
guidance = """
Run only affected checks unless the user requests broader verification. Use
probe ranges for behavior, inspect their rendered reports and checks, and open
generated or rendered output rather than trusting exit status alone.
"""

[preferences.landing]
keywords = { landing = "sprout", gate = "user-approval", attribution = "none" }
guidance = """
Land the approved Sprout with the guarded Sprout landing operation. Commit
self-contained changes with explicit paths and no AI attribution. Never infer
landing from worker completion or review alone, and never push, tag, publish,
or cut a release without an explicit user request.
"""
